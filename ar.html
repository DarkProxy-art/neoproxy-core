<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEO-PROXY AR v3.1</title>
<style>
body{margin:0;background:#000;overflow:hidden;font-family:monospace}
#renderCanvas{position:absolute;top:0;left:0;width:100%;height:100%}
.hud{position:fixed;top:0;left:0;width:100%;color:#0f0;font-size:12px;z-index:10;pointer-events:none;padding:10px}
.crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;border:1px solid #0f0}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div class="hud">NEO-PROXY AR v3.1 | <span id="status">INIT</span> | SCORE <span id="score">0</span></div>
<div class="crosshair"></div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<script>
let engine,scene,camera,video,model,enemies=[],score=0;
const statusEl=document.getElementById('status');
const scoreEl=document.getElementById('score');

async function initCamera(){
 video=document.createElement('video');
 video.autoplay=true;video.playsInline=true;
 try{
  const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
  video.srcObject=s;
  await video.play();
  statusEl.innerText="CAMERA OK";
  return true;
 }catch(e){statusEl.innerText="CAMERA FAIL";return false;}
}

function init3D(){
 const canvas=document.getElementById('renderCanvas');
 engine=new BABYLON.Engine(canvas,true);
 scene=new BABYLON.Scene(engine);
 scene.autoClear=false;

 const tex=new BABYLON.VideoTexture("v",video,scene,true,true);
 new BABYLON.Layer("bg",tex,scene,true);

 camera=new BABYLON.FreeCamera("cam",new BABYLON.Vector3(0,0,-2),scene);
 camera.setTarget(BABYLON.Vector3.Zero());

 new BABYLON.HemisphericLight("l",new BABYLON.Vector3(0,1,0),scene);

 spawnEnemies();

 engine.runRenderLoop(()=>scene.render());
}

function spawnEnemies(){
 for(let i=0;i<5;i++){
  const e=BABYLON.MeshBuilder.CreateSphere("e"+Date.now()+i,{diameter:0.3},scene);
  e.position=new BABYLON.Vector3((Math.random()-0.5)*3,(Math.random()-0.5)*2,Math.random()*-3);
  e.material=new BABYLON.StandardMaterial("m",scene);
  e.material.emissiveColor=new BABYLON.Color3(1,0,0);
  e.enableEdgesRendering();
  e.edgesWidth=2;
  e.edgesColor=new BABYLON.Color4(0,1,0,1);
  enemies.push(e);
 }
}

let frameSkip=0;
async function detectLoop(){
 frameSkip++;
 if(frameSkip%5!==0){requestAnimationFrame(detectLoop);return;}
 if(model&&video.readyState===4){
  const preds=await model.detect(video);
  statusEl.innerText="AI "+preds.length;
 }
 requestAnimationFrame(detectLoop);
}

function shoot(){
 const ray=camera.getForwardRay();
 enemies.forEach((e,i)=>{
  if(ray.intersectsMesh(e,false)){
   e.dispose();
   enemies.splice(i,1);
   score+=100;
   scoreEl.innerText=score;
   saveKill(e.name);
  }
 });
}

async function saveKill(id){
 try{
  await fetch("https://neoproxy.art/api/memory",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    title:"AR_KILL_"+Date.now(),
    content:JSON.stringify({id,score})
   })
  });
 }catch(e){}
}

async function init(){
 const ok=await initCamera();
 if(!ok)return;
 init3D();
 model=await cocoSsd.load();
 detectLoop();
 document.body.addEventListener("touchstart",shoot);
 document.body.addEventListener("mousedown",shoot);
 statusEl.innerText="ONLINE";
}

init();
</script>
</body>
</html>
