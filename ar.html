<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: monospace;
  color: #ff3c00;
}

/* VIDEO */
video {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* HUD BASE */
.hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* TOP BAR */
.topbar {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  border: 1px solid #ff3c00;
  padding: 5px 20px;
  background: rgba(0,0,0,0.6);
}

/* LEFT PANEL */
.panel-left {
  position: absolute;
  top: 60px;
  left: 10px;
  width: 200px;
  border: 1px solid #ff3c00;
  padding: 10px;
  background: rgba(0,0,0,0.6);
  font-size: 12px;
}

/* TARGET */
.target {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 120px;
  height: 120px;
  transform: translate(-50%, -50%);
}

.target::before,
.target::after {
  content: "";
  position: absolute;
  border: 2px solid #ff3c00;
}

.target::before {
  width: 100%;
  height: 100%;
}

.target::after {
  width: 40px;
  height: 40px;
  top: 40px;
  left: 40px;
}

/* WEAPON */
.weapon {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 250px;
  height: 180px;
  background: linear-gradient(45deg, #111, #222);
  border-left: 2px solid #ff3c00;
  border-top: 2px solid #ff3c00;
}

/* AMMO */
.ammo {
  position: absolute;
  bottom: 20px;
  left: 20px;
  border: 1px solid #ff3c00;
  padding: 5px;
  background: rgba(0,0,0,0.6);
}

/* MEMORY */
.memory {
  position: absolute;
  top: 10px;
  right: 10px;
}
</style>
</head>

<body>

<video id="cam" autoplay playsinline></video>

<div class="hud">

  <div class="topbar">
    NEO-PROXY v0.2
  </div>

  <div class="panel-left">
    OPERATOR: DARKPROXY<br>
    STATUS: STABLE<br><br>
    BOOT SEQUENCE...<br>
    MEMORY NODES: 11
  </div>

  <div class="target"></div>

  <div class="weapon"></div>

  <div class="ammo">
    AMMO: 24
  </div>

  <div class="memory">
    MEMORY: 11
  </div>

</div>

<script>
const video = document.getElementById("cam");

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
  video.srcObject = stream;
})
.catch(err => {
  alert("Camera error: " + err);
});

/* SHOOT EFFECT */
document.addEventListener("click", () => {
  const target = document.querySelector(".target");
  target.style.borderColor = "white";
  setTimeout(() => {
    target.style.borderColor = "#ff3c00";
  }, 100);
});
</script>

</body>
</html>
