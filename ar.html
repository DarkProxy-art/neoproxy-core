<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>NEO-PROXY COMBAT v0.1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #000; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; position: fixed; width: 100%; }
        #gameCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; z-index: 1; }
        
        /* HUD */
        .hud { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 15px; display: flex; justify-content: space-between; pointer-events: none; }
        .hud-panel { background: rgba(0,0,0,0.8); border: 1px solid #0f0; padding: 8px 15px; backdrop-filter: blur(4px); }
        .hud-panel div { color: #0f0; font-size: 12px; letter-spacing: 1px; }
        .score { font-size: 24px; font-weight: bold; }
        
        /* Health Bar */
        .health-container { position: fixed; bottom: 80px; left: 20px; right: 20px; z-index: 10; pointer-events: none; }
        .health-bg { background: #1a0000; height: 12px; border: 1px solid #0f0; border-radius: 2px; overflow: hidden; }
        .health-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.2s; box-shadow: 0 0 5px #0f0; }
        .health-text { color: #0f0; font-size: 10px; margin-top: 4px; text-align: center; }
        
        /* Crosshair */
        .crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; z-index: 15; pointer-events: none; }
        .crosshair::before, .crosshair::after { content: ''; position: absolute; background: #0f0; box-shadow: 0 0 4px #0f0; }
        .crosshair::before { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%); }
        .crosshair::after { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); }
        
        /* Botón de disparo (táctil) */
        .fire-btn { position: fixed; bottom: 20px; right: 20px; width: 80px; height: 80px; border-radius: 50%; background: rgba(0,255,0,0.2); border: 3px solid #0f0; z-index: 20; pointer-events: auto; cursor: pointer; box-shadow: 0 0 15px rgba(0,255,0,0.3); }
        .fire-btn:active { background: rgba(0,255,0,0.5); transform: scale(0.95); }
        .fire-btn span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #0f0; font-size: 12px; font-weight: bold; }
        
        /* Joystick área */
        .joystick-area { position: fixed; bottom: 20px; left: 20px; width: 120px; height: 120px; border-radius: 50%; background: rgba(0,255,0,0.1); border: 2px solid #0f0; z-index: 20; pointer-events: auto; }
        .joystick-base { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; background: rgba(0,255,0,0.5); border-radius: 50%; border: 2px solid #0f0; transition: transform 0.05s; }
        
        /* Daño */
        .damage-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,0,0,0); pointer-events: none; z-index: 5; transition: background 0.05s; }
        
        /* Mensajes flotantes */
        .float-msg { position: fixed; font-family: monospace; font-weight: bold; pointer-events: none; z-index: 25; animation: floatUp 0.6s ease-out forwards; text-shadow: 0 0 3px #0f0; }
        @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -120%) scale(1.2); } }
        
        @media (max-width: 768px) { .fire-btn { width: 70px; height: 70px; } .joystick-area { width: 100px; height: 100px; } }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="hud">
        <div class="hud-panel">
            <div>NEO·PROXY·COMBAT</div>
            <div>v0.1</div>
        </div>
        <div class="hud-panel" style="text-align:right">
            <div>SCORE</div>
            <div class="score" id="scoreDisplay">0</div>
        </div>
    </div>
    
    <div class="health-container">
        <div class="health-bg"><div class="health-fill" id="healthFill" style="width:100%"></div></div>
        <div class="health-text" id="healthText">INTEGRITY: 100%</div>
    </div>
    
    <div class="crosshair"></div>
    <div class="damage-flash" id="damageFlash"></div>
    
    <!-- Controles táctiles -->
    <div class="fire-btn" id="fireBtn"><span>🔫</span></div>
    <div class="joystick-area" id="joystickArea">
        <div class="joystick-base" id="joystickBase"></div>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Dimensiones
        let width, height;
        
        // Jugador
        let player = { x: 0, y: 0, health: 100, maxHealth: 100, score: 0 };
        
        // Enemigos
        let enemies = [];
        let bullets = [];
        let particles = [];
        
        // Controles táctiles
        let moveX = 0, moveY = 0;
        let joystickActive = false;
        let joystickCenter = { x: 0, y: 0 };
        
        // Disparo
        let lastShot = 0;
        let shotDelay = 250; // ms
        let mouseX = width/2, mouseY = height/2;
        
        // Cámara/visión
        let camera = { x: 0, y: 0 };
        
        // Colores neon
        const neonGreen = '#0f0';
        const darkGreen = '#030';
        const enemyColor = '#f44';
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        
        // Inicializar enemigos
        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let x, y;
            const range = 300;
            if (side === 0) { x = -range; y = (Math.random() - 0.5) * range * 2; }
            else if (side === 1) { x = range; y = (Math.random() - 0.5) * range * 2; }
            else if (side === 2) { x = (Math.random() - 0.5) * range * 2; y = -range; }
            else { x = (Math.random() - 0.5) * range * 2; y = range; }
            
            enemies.push({
                x: x, y: y,
                health: 30,
                maxHealth: 30,
                size: 20,
                speed: 1.5,
                color: '#ff4444'
            });
        }
        
        // Disparar
        function shoot(targetX, targetY) {
            const now = Date.now();
            if (now - lastShot < shotDelay) return;
            lastShot = now;
            
            // Calcular dirección hacia el cursor/mira
            const worldTarget = {
                x: (targetX - width/2) + camera.x,
                y: (targetY - height/2) + camera.y
            };
            
            const dx = worldTarget.x - player.x;
            const dy = worldTarget.y - player.y;
            const len = Math.hypot(dx, dy);
            if (len === 0) return;
            
            bullets.push({
                x: player.x, y: player.y,
                vx: (dx / len) * 8,
                vy: (dy / len) * 8,
                life: 100
            });
            
            // Efecto de disparo
            addFloatingText("🔫", targetX, targetY, neonGreen);
        }
        
        function addFloatingText(text, x, y, color) {
            const div = document.createElement('div');
            div.className = 'float-msg';
            div.textContent = text;
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            div.style.color = color;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 600);
        }
        
        function takeDamage(amount) {
            player.health = Math.max(0, player.health - amount);
            const healthPercent = (player.health / player.maxHealth) * 100;
            document.getElementById('healthFill').style.width = healthPercent + '%';
            document.getElementById('healthText').innerHTML = `INTEGRITY: ${Math.floor(healthPercent)}%`;
            
            // Efecto visual de daño
            const flash = document.getElementById('damageFlash');
            flash.style.background = 'rgba(255,0,0,0.4)';
            setTimeout(() => flash.style.background = 'rgba(255,0,0,0)', 150);
            
            if (player.health <= 0) {
                gameOver();
            }
        }
        
        function gameOver() {
            addFloatingText("GAME OVER", width/2, height/2, '#ff0000');
            player.health = player.maxHealth;
            player.score = 0;
            enemies = [];
            bullets = [];
            document.getElementById('scoreDisplay').innerHTML = '0';
            for (let i = 0; i < 5; i++) spawnEnemy();
            const healthPercent = 100;
            document.getElementById('healthFill').style.width = '100%';
            document.getElementById('healthText').innerHTML = 'INTEGRITY: 100%';
        }
        
        function update() {
            // Movimiento del jugador con joystick
            if (moveX !== 0 || moveY !== 0) {
                const len = Math.hypot(moveX, moveY);
                if (len > 0) {
                    player.x += (moveX / len) * 4;
                    player.y += (moveY / len) * 4;
                }
            }
            
            // Actualizar cámara (sigue al jugador)
            camera.x = player.x;
            camera.y = player.y;
            
            // Actualizar balas
            for (let i = 0; i < bullets.length; i++) {
                bullets[i].x += bullets[i].vx;
                bullets[i].y += bullets[i].vy;
                bullets[i].life--;
                if (bullets[i].life <= 0 || Math.abs(bullets[i].x) > 800 || Math.abs(bullets[i].y) > 800) {
                    bullets.splice(i, 1);
                    i--;
                    continue;
                }
                
                // Colisión con enemigos
                for (let j = 0; j < enemies.length; j++) {
                    const e = enemies[j];
                    const dx = bullets[i].x - e.x;
                    const dy = bullets[i].y - e.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < e.size) {
                        e.health -= 15;
                        bullets.splice(i, 1);
                        i--;
                        
                        if (e.health <= 0) {
                            player.score += 100;
                            document.getElementById('scoreDisplay').innerHTML = player.score;
                            addFloatingText("+100", width/2 + (e.x - camera.x), height/2 + (e.y - camera.y), '#ffaa00');
                            enemies.splice(j, 1);
                            spawnEnemy(); // Reponer enemigo
                        }
                        break;
                    }
                }
            }
            
            // Actualizar enemigos (movimiento hacia el jugador)
            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                const dx = player.x - e.x;
                const dy = player.y - e.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 0) {
                    e.x += (dx / dist) * e.speed;
                    e.y += (dy / dist) * e.speed;
                }
                
                // Daño por contacto
                if (dist < 25) {
                    takeDamage(1);
                    // Empujar al enemigo
                    e.x -= (dx / dist) * 15;
                    e.y -= (dy / dist) * 15;
                }
            }
            
            // Mantener enemigos en rango
            if (enemies.length < 3) {
                spawnEnemy();
            }
        }
        
        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Fondo tipo grid
            ctx.strokeStyle = neonGreen;
            ctx.lineWidth = 1;
            const gridSize = 50;
            const offsetX = camera.x % gridSize;
            const offsetY = camera.y % gridSize;
            for (let x = -offsetX; x < width + gridSize; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = -offsetY; y < height + gridSize; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            
            // Dibujar enemigos
            for (const e of enemies) {
                const screenX = width/2 + (e.x - camera.x);
                const screenY = height/2 + (e.y - camera.y);
                
                // Sombra/glow
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0000';
                
                // Cuerpo del enemigo
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.rect(screenX - e.size/2, screenY - e.size/2, e.size, e.size);
                ctx.fill();
                
                // Ojos
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(screenX - 5, screenY - 3, 3, 0, Math.PI * 2);
                ctx.arc(screenX + 5, screenY - 3, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(screenX - 5 + (Math.random() * 2 - 1), screenY - 3, 1.5, 0, Math.PI * 2);
                ctx.arc(screenX + 5 + (Math.random() * 2 - 1), screenY - 3, 1.5, 0, Math.PI * 2);
                ctx.fill();
                
                // Barra de salud del enemigo
                const healthPercent = e.health / e.maxHealth;
                ctx.fillStyle = '#300';
                ctx.fillRect(screenX - 15, screenY - 18, 30, 4);
                ctx.fillStyle = '#f00';
                ctx.fillRect(screenX - 15, screenY - 18, 30 * healthPercent, 4);
            }
            
            // Dibujar balas
            for (const b of bullets) {
                const screenX = width/2 + (b.x - camera.x);
                const screenY = height/2 + (b.y - camera.y);
                ctx.fillStyle = '#ffaa00';
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#ffaa00';
                ctx.beginPath();
                ctx.arc(screenX, screenY, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Dibujar jugador (triángulo)
            ctx.shadowBlur = 8;
            ctx.shadowColor = neonGreen;
            ctx.fillStyle = neonGreen;
            const px = width/2;
            const py = height/2;
            ctx.beginPath();
            ctx.moveTo(px, py - 15);
            ctx.lineTo(px - 12, py + 10);
            ctx.lineTo(px, py + 5);
            ctx.lineTo(px + 12, py + 10);
            ctx.fill();
            
            // Escudo visual
            ctx.strokeStyle = neonGreen;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(px, py, 20, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.shadowBlur = 0;
            
            // Ammo indicator
            ctx.font = '12px "Courier New", monospace';
            ctx.fillStyle = neonGreen;
            ctx.fillText(`AMMO: INF`, width - 80, 40);
            ctx.fillText(`KILLS: ${Math.floor(player.score/100)}`, width - 80, 60);
        }
        
        // Controles táctiles
        const joystickArea = document.getElementById('joystickArea');
        const joystickBase = document.getElementById('joystickBase');
        
        function handleTouchStart(e) {
            e.preventDefault();
            const rect = joystickArea.getBoundingClientRect();
            joystickCenter.x = rect.left + rect.width/2;
            joystickCenter.y = rect.top + rect.height/2;
            joystickActive = true;
            handleTouchMove(e);
        }
        
        function handleTouchMove(e) {
            e.preventDefault();
            if (!joystickActive) return;
            const touch = e.touches[0];
            const dx = touch.clientX - joystickCenter.x;
            const dy = touch.clientY - joystickCenter.y;
            const maxDist = 40;
            let dist = Math.hypot(dx, dy);
            if (dist > maxDist) dist = maxDist;
            moveX = dx;
            moveY = dy;
            const angle = Math.atan2(dy, dx);
            const stickX = Math.cos(angle) * dist;
            const stickY = Math.sin(angle) * dist;
            joystickBase.style.transform = `translate(calc(-50% + ${stickX}px), calc(-50% + ${stickY}px))`;
        }
        
        function handleTouchEnd(e) {
            e.preventDefault();
            joystickActive = false;
            moveX = 0;
            moveY = 0;
            joystickBase.style.transform = 'translate(-50%, -50%)';
        }
        
        joystickArea.addEventListener('touchstart', handleTouchStart);
        joystickArea.addEventListener('touchmove', handleTouchMove);
        joystickArea.addEventListener('touchend', handleTouchEnd);
        
        // Disparo táctil
        const fireBtn = document.getElementById('fireBtn');
        fireBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            shoot(width/2, height/2);
        });
        fireBtn.addEventListener('mousedown', () => shoot(width/2, height/2));
        
        // Mouse/touch para apuntar (en móvil, la mira está centrada)
        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        // Bucle del juego
        resize();
        window.addEventListener('resize', resize);
        
        // Spawn inicial
        for (let i = 0; i < 4; i++) spawnEnemy();
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();
        
        // Instrucciones
        setTimeout(() => {
            addFloatingText("USAR JOYSTICK IZQUIERDO", width/2, height - 100, neonGreen);
            addFloatingText("BOTÓN ROJO PARA DISPARAR", width/2, height - 70, neonGreen);
        }, 500);
    </script>
</body>
</html>
