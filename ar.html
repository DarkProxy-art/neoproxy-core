<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEO-PROXY AR | Realidad Aumentada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #000; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .hud { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 2; pointer-events: none; }
        .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, rgba(0,255,0,0) 0px, rgba(0,255,0,0) 2px, rgba(0,255,0,0.03) 2px, rgba(0,255,0,0.03) 4px); pointer-events: none; z-index: 10; animation: scan 8s linear infinite; }
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        .hud-corner { position: absolute; color: #0f0; text-shadow: 0 0 5px #0f0; font-size: 12px; background: rgba(0,0,0,0.7); padding: 10px 15px; border: 1px solid #0f0; backdrop-filter: blur(5px); pointer-events: auto; }
        .top-left { top: 20px; left: 20px; }
        .top-right { top: 20px; right: 20px; text-align: right; }
        .bottom-left { bottom: 20px; left: 20px; }
        .bottom-right { bottom: 20px; right: 20px; text-align: right; }
        .health-bar { width: 200px; height: 8px; background: #1a0a0a; border: 1px solid #0f0; margin-top: 5px; }
        .health-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.3s; }
        .ammo { font-size: 24px; font-weight: bold; }
        .radar { width: 100px; height: 100px; border-radius: 50%; border: 1px solid #0f0; position: relative; background: rgba(0,15,0,0.3); margin-bottom: 10px; }
        .radar-scan { position: absolute; top: 50%; left: 50%; width: 100%; height: 100%; transform-origin: center; animation: radarSpin 3s linear infinite; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0%, #0f0 100%); mask: radial-gradient(circle, transparent 60%, black 61%); opacity: 0.3; }
        @keyframes radarSpin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        .crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; z-index: 15; pointer-events: none; }
        .crosshair::before, .crosshair::after { content: ''; position: absolute; background: #0f0; }
        .crosshair::before { top: 50%; left: 0; right: 0; height: 1px; transform: translateY(-50%); }
        .crosshair::after { left: 50%; top: 0; bottom: 0; width: 1px; transform: translateX(-50%); }
        .damage-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(255,0,0,0) 0%, rgba(255,0,0,0.3) 100%); pointer-events: none; z-index: 20; opacity: 0; transition: opacity 0.1s; }
        .terminal-hud { position: fixed; bottom: 20px; left: 20px; right: 20px; background: rgba(0,0,0,0.85); border: 1px solid #0f0; padding: 10px; font-size: 11px; color: #0f0; backdrop-filter: blur(5px); pointer-events: auto; z-index: 25; }
        .terminal-input { background: transparent; border: none; color: #0f0; font-family: monospace; width: calc(100% - 60px); outline: none; }
        .terminal-prompt { color: #0f0; font-weight: bold; }
        .floating-message { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #0f0; font-size: 24px; text-shadow: 0 0 10px #0f0; pointer-events: none; z-index: 30; animation: fadeUp 1s ease-out forwards; white-space: nowrap; }
        @keyframes fadeUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -100%) scale(1.5); } }
        @media (max-width: 768px) { .hud-corner { font-size: 8px; padding: 5px 10px; } .ammo { font-size: 18px; } .radar { width: 70px; height: 70px; } }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="hud">
        <div class="hud-corner top-left"><div>NEO-PROXY AR v0.3</div><div>SCORE: <span id="score">0</span></div></div>
        <div class="hud-corner top-right"><div>HEALTH</div><div class="health-bar"><div class="health-fill" id="healthFill" style="width: 100%"></div></div><div id="healthText">100%</div><div style="margin-top:10px;">AMMO</div><div class="ammo"><span id="ammo">30</span> <span style="font-size:12px;">/ 30</span></div></div>
        <div class="hud-corner bottom-left"><div>RADAR</div><div class="radar" id="radar"><div class="radar-scan" style="position:absolute;top:50%;left:50%;"></div><div id="enemyDots"></div></div><div id="enemyCount">ENEMIES: 0</div></div>
        <div class="hud-corner bottom-right"><div>KILLS: <span id="kills">0</span></div><div>HEADSHOTS: <span id="headshots">0</span></div></div>
    </div>
    <div class="crosshair"></div>
    <div class="damage-overlay" id="damageOverlay"></div>
    <div class="scanline"></div>
    <div class="terminal-hud"><span class="terminal-prompt">> NP-AR://</span><input type="text" id="terminalInput" class="terminal-input" placeholder="help, stats, reload, god" autocomplete="off"><div id="terminalOutput" style="margin-top:5px;font-size:10px;"></div></div>

    <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }</script>
    <script type="module">
        import * as THREE from 'three';
        let score=0,kills=0,headshots=0,health=100,ammo=30,maxAmmo=30,reloading=false;
        let enemies=[],enemyMeshes=[];
        const container=document.getElementById('canvas-container');
        const scene=new THREE.Scene(); scene.background=new THREE.Color(0x000000); scene.fog=new THREE.FogExp2(0x000000,0.008);
        const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
        camera.position.set(0,1.6,5);
        const renderer=new THREE.WebGLRenderer({antialias:true});
        renderer.setSize(window.innerWidth,window.innerHeight); renderer.shadowMap.enabled=true;
        container.appendChild(renderer.domElement);
        let mouseX=0,mouseY=0,targetRotationX=0,targetRotationY=0;
        document.addEventListener('mousemove',(e)=>{ mouseX=(e.clientX/window.innerWidth)*2-1; mouseY=(e.clientY/window.innerHeight)*2-1; targetRotationY=mouseX*0.5; targetRotationX=Math.max(-0.5,Math.min(0.5,-mouseY*0.3)); });
        document.addEventListener('click',(e)=>{ if(e.target.id!=='terminalInput') shoot(); });
        document.addEventListener('touchstart',(e)=>{ if(e.target.id!=='terminalInput'){ e.preventDefault(); shoot(); } });
        function shoot(){
            if(reloading){ addMessage("⛔ RECARGANDO...","#ff6600"); return; }
            if(ammo<=0){ addMessage("🔫 SIN MUNICIÓN! Usa 'reload'","#ff0000"); return; }
            ammo--; updateUI();
            const raycaster=new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
            const intersects=raycaster.intersectObjects(enemyMeshes);
            if(intersects.length>0){
                const hit=intersects[0];
                const enemy=hit.object.userData.enemy;
                enemy.health-=34;
                addMessage(`💥 +34 DAMAGE`,"#0f0");
                if(enemy.health<=0){
                    const idx=enemies.indexOf(enemy);
                    if(idx>-1){ enemies.splice(idx,1); scene.remove(hit.object); enemyMeshes.splice(enemyMeshes.indexOf(hit.object),1); kills++; score+=100; updateUI(); addMessage(`✅ ELIMINADO! +100`,"#0f0"); spawnEnemy(); }
                }else{ hit.object.material.emissiveIntensity=0.5; setTimeout(()=>{ if(hit.object) hit.object.material.emissiveIntensity=0; },100); }
            }
            const flash=document.createElement('div'); flash.style.position='fixed'; flash.style.top=0; flash.style.left=0; flash.style.width='100%'; flash.style.height='100%'; flash.style.backgroundColor='rgba(0,255,0,0.1)'; flash.style.pointerEvents='none'; flash.style.zIndex=999; document.body.appendChild(flash); setTimeout(()=>flash.remove(),50);
            updateUI();
        }
        function reload(){ if(reloading) return; reloading=true; addMessage("🔄 RECARGANDO...","#ffaa00"); setTimeout(()=>{ ammo=maxAmmo; reloading=false; updateUI(); addMessage("✅ RECARGA COMPLETA!","#0f0"); },1500); }
        function spawnEnemy(){
            const geometry=new THREE.BoxGeometry(0.8,1.2,0.8);
            const material=new THREE.MeshStandardMaterial({color:0xff3300,emissive:0x330000,emissiveIntensity:0.3});
            const enemy=new THREE.Mesh(geometry,material);
            const angle=Math.random()*Math.PI*2;
            const radius=4+Math.random()*3;
            enemy.position.set(Math.cos(angle)*radius,0.6,Math.sin(angle)*radius);
            enemy.castShadow=true; enemy.receiveShadow=true;
            enemy.userData={ enemy:{ health:100, speed:0.02+Math.random()*0.02 } };
            scene.add(enemy);
            enemies.push(enemy.userData.enemy);
            enemyMeshes.push(enemy);
            updateEnemyCount();
        }
        function updateEnemyCount(){
            document.getElementById('enemyCount').innerHTML=`ENEMIES: ${enemies.length}`;
            const radarDiv=document.getElementById('enemyDots'); radarDiv.innerHTML='';
            enemies.forEach((enemy,idx)=>{
                const mesh=enemyMeshes[idx];
                if(mesh){
                    const dx=mesh.position.x, dz=mesh.position.z;
                    const radarX=(dx/5)*40, radarZ=(dz/5)*40;
                    const dot=document.createElement('div');
                    dot.style.position='absolute'; dot.style.left=`calc(50% + ${radarX}px - 2px)`;
                    dot.style.top=`calc(50% + ${radarZ}px - 2px)`;
                    dot.style.width='4px'; dot.style.height='4px'; dot.style.backgroundColor='#ff3300';
                    dot.style.borderRadius='50%'; dot.style.boxShadow='0 0 5px #ff3300';
                    radarDiv.appendChild(dot);
                }
            });
        }
        function updateUI(){
            document.getElementById('score').innerHTML=score;
            document.getElementById('kills').innerHTML=kills;
            document.getElementById('headshots').innerHTML=headshots;
            document.getElementById('healthFill').style.width=`${health}%`;
            document.getElementById('healthText').innerHTML=`${health}%`;
            document.getElementById('ammo').innerHTML=ammo;
            if(health<=0) gameOver();
        }
        function gameOver(){
            addMessage("💀 GAME OVER 💀","#ff0000");
            setTimeout(()=>{ health=100; score=0; kills=0; ammo=30; updateUI(); addMessage("🔄 REINICIANDO...","#0f0"); },3000);
        }
        function takeDamage(amount){
            health=Math.max(0,health-amount); updateUI();
            const overlay=document.getElementById('damageOverlay');
            overlay.style.opacity='0.5'; setTimeout(()=>overlay.style.opacity='0',200);
            if(health<=0) gameOver();
        }
        function addMessage(msg,color="#0f0"){
            const msgDiv=document.createElement('div');
            msgDiv.className='floating-message'; msgDiv.innerHTML=msg; msgDiv.style.color=color;
            document.body.appendChild(msgDiv); setTimeout(()=>msgDiv.remove(),1000);
        }
        const ambientLight=new THREE.AmbientLight(0x111111); scene.add(ambientLight);
        const directionalLight=new THREE.DirectionalLight(0xffffff,1); directionalLight.position.set(5,10,7); directionalLight.castShadow=true; scene.add(directionalLight);
        const gridHelper=new THREE.GridHelper(20,20,0x00ff00,0x006600); gridHelper.position.y=-0.5; scene.add(gridHelper);
        for(let i=0;i<3;i++) spawnEnemy();
        const terminalInput=document.getElementById('terminalInput');
        const terminalOutput=document.getElementById('terminalOutput');
        terminalInput.addEventListener('keypress',(e)=>{
            if(e.key==='Enter'){
                const cmd=terminalInput.value.toLowerCase();
                terminalOutput.innerHTML+=`<div>> ${cmd}</div>`;
                if(cmd==='help') terminalOutput.innerHTML+=`<div>Comandos: stats | reload | god | infiniteammo</div>`;
                else if(cmd==='stats') terminalOutput.innerHTML+=`<div>KILLS:${kills} SCORE:${score} HEALTH:${health}%</div>`;
                else if(cmd==='reload'){ reload(); terminalOutput.innerHTML+=`<div>🔄 RECARGANDO...</div>`; }
                else if(cmd==='god'){ health=999; updateUI(); terminalOutput.innerHTML+=`<div>✨ MODO DIOS</div>`; }
                else if(cmd==='infiniteammo'){ maxAmmo=999; ammo=999; updateUI(); terminalOutput.innerHTML+=`<div>♾️ MUNICIÓN INFINITA</div>`; }
                else if(cmd!=='') terminalOutput.innerHTML+=`<div>❌ Comando: ${cmd}</div>`;
                terminalInput.value=''; terminalOutput.scrollTop=terminalOutput.scrollHeight;
            }
        });
        function animate(){
            requestAnimationFrame(animate);
            camera.rotation.order='YXZ'; camera.rotation.y=targetRotationY; camera.rotation.x=targetRotationX;
            for(let i=0;i<enemyMeshes.length;i++){
                const enemy=enemyMeshes[i];
                const direction=new THREE.Vector3().subVectors(camera.position,enemy.position).normalize();
                enemy.position.x+=direction.x*0.02; enemy.position.z+=direction.z*0.02;
                if(enemy.position.distanceTo(camera.position)<1.5){ takeDamage(0.5); enemy.position.x+=(Math.random()-0.5)*0.5; enemy.position.z+=(Math.random()-0.5)*0.5; }
            }
            updateEnemyCount();
            renderer.render(scene,camera);
        }
        animate();
        window.addEventListener('resize',()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });
        setTimeout(()=>{ addMessage("🎮 BIENVENIDO A NEO-PROXY AR","#0f0"); addMessage("🔫 CLICK/TAP PARA DISPARAR","#0f0"); addMessage("💻 USA 'reload' EN LA TERMINAL","#0f0"); },500);
    </script>
</body>
</html>
