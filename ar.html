<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>NEO-PROXY VISION v2.0 | AR + AI + SENSORS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            overflow: hidden; 
            font-family: 'Courier New', monospace;
            touch-action: none;
        }
        #renderCanvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 10; 
            touch-action: none;
        }
        #video-feed {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.7) contrast(1.3) saturate(0.8) hue-rotate(85deg) sepia(0.3);
        }
        /* Overlay HUD */
        .hud-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            pointer-events: none;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
        }
        .hud-panel {
            background: rgba(0,0,0,0.6);
            border: 1px solid #0f0;
            padding: 8px 15px;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px rgba(0,255,0,0.2);
        }
        .hud-panel div {
            color: #0f0;
            font-size: 10px;
            letter-spacing: 1px;
        }
        .hud-panel .value {
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 5px #0f0;
        }
        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,255,0,0.05) 0px, rgba(0,255,0,0.05) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            z-index: 30;
        }
        /* Centro de mira */
        .crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            z-index: 25;
            pointer-events: none;
        }
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background: #0f0;
            box-shadow: 0 0 5px #0f0;
        }
        .crosshair::before {
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
        }
        .crosshair::after {
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            transform: translateX(-50%);
        }
        /* Mensajes flotantes */
        .scan-message {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            border: 1px solid #0f0;
            padding: 10px 20px;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            z-index: 35;
            white-space: nowrap;
            animation: scanPulse 0.5s ease-out;
            pointer-events: none;
        }
        @keyframes scanPulse {
            0% { opacity: 0; transform: translateX(-50%) scale(0.8); }
            100% { opacity: 1; transform: translateX(-50%) scale(1); }
        }
        @media (max-width: 768px) {
            .hud-panel { padding: 5px 10px; }
            .hud-panel .value { font-size: 14px; }
        }
    </style>
</head>
<body>
    <video id="video-feed" autoplay playsinline muted></video>
    <canvas id="renderCanvas"></canvas>
    <div class="scanlines"></div>
    <div class="crosshair"></div>
    
    <div class="hud-overlay">
        <div class="hud-panel">
            <div>NEO-PROXY // VISION OS</div>
            <div>v2.0 | AR MODE</div>
        </div>
        <div class="hud-panel" style="text-align:right">
            <div>STATUS</div>
            <div class="value" id="statusValue">SCANNING</div>
        </div>
    </div>
    
    <div class="hud-overlay" style="top: auto; bottom: 0; background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 100%);">
        <div class="hud-panel">
            <div>OBJECTIVES</div>
            <div id="objectivesList" style="font-size: 8px;">- SCAN ENVIRONMENT</div>
        </div>
        <div class="hud-panel" style="text-align:right">
            <div>DETECTIONS</div>
            <div class="value" id="detectionCount">0</div>
        </div>
    </div>

    <div id="scanMessageContainer"></div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <script>
        // ============================================
        // NEO-PROXY VISION v2.0
        // Babylon.js + TensorFlow.js + Device Sensors
        // ============================================
        
        let model;
        let video;
        let canvas;
        let engine;
        let scene;
        let camera3D;
        let scanningObjects = [];
        let detectionHistory = [];
        let scanLines = [];
        let particleSystem;
        
        // UI Elements
        const statusEl = document.getElementById('statusValue');
        const detectionCountEl = document.getElementById('detectionCount');
        const objectivesList = document.getElementById('objectivesList');
        const scanMessageContainer = document.getElementById('scanMessageContainer');
        
        // Configuración
        const SCAN_DETECTIONS = [];
        let lastScanTime = 0;
        let frameCount = 0;
        
        // ============================================
        // 1. INICIALIZAR CÁMARA DEL DISPOSITIVO
        // ============================================
        async function initCamera() {
            video = document.getElementById('video-feed');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
                video.srcObject = stream;
                await video.play();
                statusEl.innerHTML = "CAMERA: OK";
                return true;
            } catch (err) {
                console.error("Camera error:", err);
                statusEl.innerHTML = "CAMERA: FAIL";
                return false;
            }
        }
        
        // ============================================
        // 2. INICIALIZAR SENSORES (Giroscopio + Acelerómetro)
        // ============================================
        function initSensors() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (event) => {
                    if (camera3D) {
                        // Mapear ángulos del dispositivo a rotación 3D
                        const gamma = event.gamma || 0;  // -90 a 90 (inclinación lateral)
                        const beta = event.beta || 0;    // -180 a 180 (inclinación frontal)
                        
                        // Rotación suave para la cámara 3D
                        camera3D.rotation.x = BABYLON.Tools.ToRadians(Math.max(-45, Math.min(45, beta - 90)));
                        camera3D.rotation.y = BABYLON.Tools.ToRadians(Math.max(-60, Math.min(60, gamma)));
                        
                        document.getElementById('sensor-data')?.remove();
                    }
                });
                statusEl.innerHTML = "SENSORS: ACTIVE";
            } else {
                console.log("Device orientation not supported");
            }
        }
        
        // ============================================
        // 3. INICIALIZAR TENSORFLOW.JS (COCO-SSD)
        // ============================================
        async function initAI() {
            statusEl.innerHTML = "AI: LOADING MODEL...";
            try {
                model = await cocoSsd.load();
                statusEl.innerHTML = "AI: ACTIVE [COCO-SSD]";
                startDetection();
            } catch (err) {
                console.error("AI Error:", err);
                statusEl.innerHTML = "AI: ERROR";
            }
        }
        
        function showScanMessage(message, type = 'info') {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'scan-message';
            msgDiv.innerHTML = `🔍 ${message}`;
            msgDiv.style.borderColor = type === 'enemy' ? '#ff0000' : '#0f0';
            msgDiv.style.color = type === 'enemy' ? '#ff4444' : '#0f0';
            scanMessageContainer.appendChild(msgDiv);
            setTimeout(() => msgDiv.remove(), 3000);
        }
        
        async function startDetection() {
            async function detect() {
                if (!model || !video || video.readyState !== 4) {
                    requestAnimationFrame(detect);
                    return;
                }
                
                try {
                    const predictions = await model.detect(video);
                    frameCount++;
                    
                    if (predictions.length > 0) {
                        detectionCountEl.innerHTML = predictions.length;
                        statusEl.innerHTML = "SCANNING: ACTIVE";
                        
                        // Actualizar objetivos detectados
                        let objectivesHtml = '';
                        predictions.slice(0, 3).forEach(pred => {
                            const confidence = (pred.score * 100).toFixed(0);
                            objectivesHtml += `<div style="color: #0f0;">- ${pred.class.toUpperCase()} [${confidence}%]</div>`;
                            
                            // Notificar nuevos objetos interesantes
                            const now = Date.now();
                            if (!detectionHistory[pred.class] || now - detectionHistory[pred.class] > 5000) {
                                detectionHistory[pred.class] = now;
                                if (['person', 'cell phone', 'laptop', 'book'].includes(pred.class)) {
                                    showScanMessage(`${pred.class.toUpperCase()} DETECTED - CYBERNETIC ARTIFACT`, 'info');
                                    add3DMarker(pred);
                                }
                            }
                        });
                        objectivesList.innerHTML = objectivesHtml || '<div>- NO TARGETS</div>';
                        
                        // Efecto de pulso en el HUD
                        if (predictions.length > 0 && frameCount % 30 === 0) {
                            statusEl.style.textShadow = '0 0 10px #0f0';
                            setTimeout(() => statusEl.style.textShadow = 'none', 200);
                        }
                    } else {
                        detectionCountEl.innerHTML = '0';
                        objectivesList.innerHTML = '<div>- SCANNING VOID</div>';
                    }
                    
                } catch (err) {
                    console.error("Detection error:", err);
                }
                
                requestAnimationFrame(detect);
            }
            
            detect();
        }
        
        // ============================================
        // 4. CREAR MARCADORES 3D CON BABYLON.JS
        // ============================================
        function add3DMarker(detection) {
            if (!scene) return;
            
            // Crear un cubo flotante que representa el objeto detectado
            const box = BABYLON.MeshBuilder.CreateBox(`marker_${Date.now()}`, { size: 0.3 }, scene);
            const mat = new BABYLON.StandardMaterial(`markerMat_${Date.now()}`, scene);
            mat.emissiveColor = new BABYLON.Color3(0, 1, 0);
            mat.alpha = 0.7;
            box.material = mat;
            
            // Posición aleatoria en el campo de visión
            const angleX = (Math.random() - 0.5) * Math.PI / 2;
            const angleY = (Math.random() - 0.5) * Math.PI / 2;
            box.position = new BABYLON.Vector3(
                Math.sin(angleX) * 2,
                Math.cos(angleY) * 1.5 - 0.5,
                2 + Math.random() * 1
            );
            
            // Animación de flotación
            let time = 0;
            const animate = () => {
                if (box.isDisposed()) return;
                time += 0.05;
                box.position.y += Math.sin(time) * 0.005;
                box.scaling = new BABYLON.Vector3(1 + Math.sin(time * 3) * 0.1, 1 + Math.sin(time * 3) * 0.1, 1);
                requestAnimationFrame(animate);
            };
            animate();
            
            // Auto-destrucción después de 5 segundos
            setTimeout(() => {
                if (box && !box.isDisposed()) box.dispose();
            }, 5000);
        }
        
        // ============================================
        // 5. CREAR ESCENA 3D DE BABYLON.JS
        // ============================================
        function create3DScene() {
            canvas = document.getElementById('renderCanvas');
            engine = new BABYLON.Engine(canvas, true);
            scene = new BABYLON.Scene(engine);
            scene.autoClear = false; // Para ver el video detrás
            
            // Cámara que responde a los sensores
            camera3D = new BABYLON.FreeCamera("arCamera", new BABYLON.Vector3(0, 0, -3), scene);
            camera3D.setTarget(BABYLON.Vector3.Zero());
            camera3D.fov = 0.8;
            
            // Iluminación cyberpunk
            const ambientLight = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.diffuse = new BABYLON.Color3(0.2, 0.8, 0.2);
            ambientLight.specular = new BABYLON.Color3(0, 0.5, 0);
            
            const pointLight = new BABYLON.PointLight("pointLight", new BABYLON.Vector3(0, 2, 2), scene);
            pointLight.intensity = 0.8;
            pointLight.diffuse = new BABYLON.Color3(0, 1, 0);
            
            // Partículas de escaneo (líneas láser)
            const particleSystem = new BABYLON.ParticleSystem("scanParticles", 500, scene);
            particleSystem.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
            particleSystem.emitter = new BABYLON.Vector3(0, 0, 2);
            particleSystem.minEmitBox = new BABYLON.Vector3(-1, -0.5, 0);
            particleSystem.maxEmitBox = new BABYLON.Vector3(1, 0.5, 0);
            particleSystem.color1 = new BABYLON.Color4(0, 1, 0, 1);
            particleSystem.color2 = new BABYLON.Color4(0, 0.5, 0, 1);
            particleSystem.minSize = 0.02;
            particleSystem.maxSize = 0.08;
            particleSystem.minLifeTime = 0.5;
            particleSystem.maxLifeTime = 1.5;
            particleSystem.emitRate = 100;
            particleSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
            particleSystem.start();
            
            // Crear un panel HUD flotante
            const hudPlane = BABYLON.MeshBuilder.CreatePlane("hudPanel", { width: 1.5, height: 0.8 }, scene);
            hudPlane.position = new BABYLON.Vector3(1.2, -0.8, 2);
            hudPlane.parent = camera3D;
            
            const hudMaterial = new BABYLON.StandardMaterial("hudMat", scene);
            hudMaterial.emissiveColor = new BABYLON.Color3(0, 1, 0);
            hudMaterial.alpha = 0.3;
            hudPlane.material = hudMaterial;
            
            // Texto en el panel HUD
            const dynamicTexture = new BABYLON.DynamicTexture("hudTexture", { width: 512, height: 256 }, scene);
            const ctx = dynamicTexture.getContext();
            ctx.fillStyle = '#0f0';
            ctx.font = 'bold 20px "Courier New"';
            ctx.fillText('NEO-PROXY', 20, 40);
            ctx.font = '12px monospace';
            ctx.fillText('AR MODE ACTIVE', 20, 70);
            ctx.fillText('AI SCANNING...', 20, 100);
            dynamicTexture.update();
            hudMaterial.diffuseTexture = dynamicTexture;
            
            // Animar textura del HUD
            setInterval(() => {
                if (dynamicTexture && !dynamicTexture.isDisposed) {
                    const ctx2 = dynamicTexture.getContext();
                    ctx2.fillStyle = '#0f0';
                    ctx2.fillRect(0, 0, 512, 256);
                    ctx2.fillStyle = '#0f0';
                    ctx2.font = 'bold 20px "Courier New"';
                    ctx2.fillText('NEO-PROXY', 20, 40);
                    ctx2.font = '12px monospace';
                    ctx2.fillText(`TARGETS: ${detectionCountEl.innerText}`, 20, 70);
                    ctx2.fillText(`STATUS: ${statusEl.innerText}`, 20, 100);
                    ctx2.fillText(new Date().toLocaleTimeString(), 20, 130);
                    dynamicTexture.update();
                }
            }, 500);
            
            return scene;
        }
        
        // ============================================
        // 6. INICIALIZAR TODO
        // ============================================
        async function init() {
            // Iniciar cámara
            const cameraReady = await initCamera();
            if (!cameraReady) {
                statusEl.innerHTML = "CAMERA: REQUIRED";
                return;
            }
            
            // Iniciar motor 3D
            const bjsScene = create3DScene();
            initSensors();
            await initAI();
            
            // Loop de renderizado
            engine.runRenderLoop(() => {
                if (bjsScene) bjsScene.render();
            });
            
            window.addEventListener('resize', () => {
                engine.resize();
            });
            
            // Mensaje de bienvenida
            setTimeout(() => {
                showScanMessage("SYSTEM READY - SCANNING ENVIRONMENT", "info");
                showScanMessage("AI MODEL COCO-SSD ACTIVE", "info");
                statusEl.style.animation = 'pulse 1s infinite';
            }, 2000);
        }
        
        // Iniciar todo
        init();
        
        // Estilo de pulso
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0%, 100% { text-shadow: 0 0 5px #0f0; }
                50% { text-shadow: 0 0 15px #0f0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
