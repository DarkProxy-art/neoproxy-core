<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEO·PROXY // AR ULTIMATE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.85) contrast(1.1) saturate(0.8);
        }
        #renderCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            outline: none;
            touch-action: none;
        }
        /* Post-processing layers */
        .noise {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjciIG51bU9jdGF2ZXM9IjMiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjZikiIG9wYWNpdHk9IjAuMDYiLz48L3N2Zz4=');
            background-repeat: repeat;
            opacity: 0.2;
            pointer-events: none;
            z-index: 20;
            mix-blend-mode: overlay;
            animation: staticShift 0.2s steps(3) infinite;
        }
        @keyframes staticShift {
            0% { transform: translate(0,0); opacity: 0.2; }
            50% { transform: translate(2px, -1px); opacity: 0.25; }
            100% { transform: translate(-1px, 1px); opacity: 0.2; }
        }
        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 1px, transparent 1px, transparent 4px);
            pointer-events: none;
            z-index: 21;
            opacity: 0.5;
        }
        .vignette {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 22;
        }
        /* HUD */
        .hud {
            position: absolute;
            z-index: 30;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #88ff99;
            text-shadow: 0 0 6px #2aff66;
            background: rgba(0, 15, 8, 0.8);
            backdrop-filter: blur(2px);
            padding: 8px 14px;
            border-left: 2px solid #88ff99;
            font-size: 12px;
        }
        .top-bar {
            top: 16px; left: 16px; right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 15, 8, 0.85);
            border: 1px solid rgba(136,255,153,0.4);
            border-left: none;
            border-right: none;
        }
        .health-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .hp-bar {
            width: 160px;
            height: 14px;
            background: #0a1a10;
            border: 1px solid #88ff99;
        }
        .hp-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #88ff99, #2aff66);
            transition: width 0.1s;
        }
        .hp-fill.low {
            background: linear-gradient(90deg, #ff6688, #ff3344);
        }
        .bottom-left {
            bottom: 16px; left: 16px;
            font-size: 10px;
        }
        .bottom-right {
            bottom: 16px; right: 16px;
            text-align: right;
        }
        .ammo-bar {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            justify-content: flex-end;
        }
        .ammo-pip {
            width: 5px;
            height: 12px;
            background: #88ff99;
            box-shadow: 0 0 3px #88ff99;
        }
        .ammo-pip.empty {
            background: #1a3322;
            box-shadow: none;
        }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
        }
        .reload-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 2px solid #ff4466;
            color: #ff4466;
            padding: 16px 32px;
            z-index: 40;
            display: none;
            font-family: monospace;
            font-size: 1.2rem;
            white-space: nowrap;
            animation: reloadPulse 0.5s infinite alternate;
        }
        @keyframes reloadPulse {
            to { text-shadow: 0 0 12px #ff4466; }
        }
        .hit-effect {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #88ff99;
            background: rgba(0,0,0,0.8);
            padding: 8px 20px;
            border: 1px solid #88ff99;
            z-index: 35;
            animation: hitFade 0.8s forwards;
            font-size: 1rem;
            white-space: nowrap;
        }
        @keyframes hitFade {
            to { opacity: 0; transform: translate(-50%, -80%); }
        }
        .damage-flash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,68,102,0.4) 0%, transparent 70%);
            pointer-events: none;
            z-index: 12;
            animation: damageAnim 0.3s forwards;
        }
        @keyframes damageAnim {
            to { opacity: 0; }
        }
        .muzzle {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 180px; height: 180px;
            background: radial-gradient(circle, #aaffbb 0%, rgba(136,255,153,0.3) 40%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 11;
            animation: muzzleAnim 0.1s forwards;
        }
        @keyframes muzzleAnim {
            to { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
        }
        .wave-alert {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            border: 2px solid #ff6688;
            color: #ff6688;
            padding: 12px 24px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            z-index: 35;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }
        .wave-alert.show {
            opacity: 1;
            animation: wavePulse 1s;
        }
        @keyframes wavePulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }
        .gyro-status {
            position: absolute;
            top: 70px;
            right: 16px;
            background: rgba(0,15,8,0.7);
            padding: 4px 10px;
            font-size: 9px;
            color: #88ff99;
            z-index: 30;
            border: 1px solid rgba(136,255,153,0.4);
        }
        .sys-msg {
            position: absolute;
            bottom: 80px;
            left: 16px;
            background: rgba(0,0,0,0.6);
            color: #ff8899;
            padding: 4px 10px;
            font-size: 9px;
            z-index: 30;
            border-left: 2px solid #ff6688;
            pointer-events: none;
        }
        #start-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #050a05;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            font-family: monospace;
        }
        #start-screen h1 {
            color: #88ff99;
            font-size: 2.5rem;
            letter-spacing: 10px;
            text-shadow: 0 0 20px #88ff99;
        }
        #start-btn {
            background: transparent;
            color: #88ff99;
            border: 1px solid #88ff99;
            padding: 16px 48px;
            font-size: 1.2rem;
            margin-top: 30px;
            cursor: pointer;
            font-family: monospace;
            letter-spacing: 4px;
        }
        #gameover-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0202;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 200;
        }
        #gameover-screen h1 {
            color: #ff4466;
            font-size: 2rem;
        }
        #final-score {
            color: #ff8888;
            font-size: 2rem;
            margin: 20px;
        }
        #restart-btn {
            background: transparent;
            color: #ff4466;
            border: 1px solid #ff4466;
            padding: 12px 32px;
            cursor: pointer;
            font-family: monospace;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<video id="camera-feed" autoplay playsinline muted></video>
<canvas id="renderCanvas"></canvas>

<div class="noise"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<div class="hud top-bar">
    <div>NEO·PROXY</div>
    <div class="health-container">
        <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>
        <span id="hp-num">100</span>
    </div>
    <div id="score">0</div>
</div>

<div class="crosshair">
    <svg width="44" height="44" viewBox="0 0 44 44">
        <circle cx="22" cy="22" r="16" fill="none" stroke="#88ff99" stroke-width="1" opacity="0.5"/>
        <circle cx="22" cy="22" r="8" fill="none" stroke="#88ff99" stroke-width="1.2"/>
        <circle cx="22" cy="22" r="2.5" fill="#88ff99"/>
        <line x1="22" y1="2" x2="22" y2="10" stroke="#88ff99" stroke-width="1.5"/>
        <line x1="22" y1="34" x2="22" y2="42" stroke="#88ff99" stroke-width="1.5"/>
        <line x1="2" y1="22" x2="10" y2="22" stroke="#88ff99" stroke-width="1.5"/>
        <line x1="34" y1="22" x2="42" y2="22" stroke="#88ff99" stroke-width="1.5"/>
    </svg>
</div>

<div class="hud bottom-left">
    <div id="ctrl-hint">GIROSCOPIO: INICIANDO...</div>
    <div style="font-size:9px;">TOCAR: DISPARAR | DOBLE: CALIBRAR</div>
</div>

<div class="hud bottom-right">
    <div id="ammo">12 / 12</div>
    <div class="ammo-bar" id="ammo-bar"></div>
    <div id="enemy-count" style="margin-top:6px;">0</div>
</div>

<div class="gyro-status" id="gyro-status">SENSOR: INICIANDO...</div>
<div class="sys-msg" id="sys-msg">[SYS] CONEXIÓN ESTABLECIDA</div>
<div id="reload-ind" class="reload-indicator">RECARGANDO...</div>
<div class="wave-alert" id="wave-alert">WAVE 1</div>

<div id="start-screen">
    <h1>NEO·PROXY</h1>
    <p style="color:#448844;">AR ULTIMATE</p>
    <button id="start-btn">CONECTAR</button>
    <p style="color:#336633; margin-top:40px;">permite cámara y sensores</p>
</div>

<div id="gameover-screen">
    <h1>MEMORY LEAK</h1>
    <div id="final-score">0</div>
    <button id="restart-btn">REINICIAR</button>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
    (function(){
        // ---------- DOM elements ----------
        const video = document.getElementById('camera-feed');
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const scoreEl = document.getElementById('score');
        const ammoEl = document.getElementById('ammo');
        const ammoBar = document.getElementById('ammo-bar');
        const enemyCountEl = document.getElementById('enemy-count');
        const reloadInd = document.getElementById('reload-ind');
        const gyroStatus = document.getElementById('gyro-status');
        const hpFill = document.getElementById('hp-fill');
        const hpNum = document.getElementById('hp-num');
        const waveAlert = document.getElementById('wave-alert');
        const ctrlHint = document.getElementById('ctrl-hint');
        const sysMsg = document.getElementById('sys-msg');

        // ---------- Game state ----------
        let scene, camera, engine;
        let enemies = [];
        let score = 0, health = 100, ammo = 12;
        const MAX_AMMO = 12, MAX_HEALTH = 100;
        let isReloading = false, gameActive = false, canShoot = true;
        let wave = 0, waveCooldown = false;
        let lastTapTime = 0;
        let useTouchFallback = false;
        let cameraRotation = { y: 0, x: 0 };

        // ---------- Audio (Web Audio API) ----------
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        function playTone(freq, dur, type, vol, freqEnd) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type || 'sawtooth';
            osc.frequency.setValueAtTime(freq, now);
            if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, now + dur);
            gain.gain.setValueAtTime(vol || 0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(now + dur);
        }
        function sndShoot() { playTone(900, 0.08, 'sawtooth', 0.12, 200); playTone(1200, 0.05, 'square', 0.06, 400); }
        function sndHit() { playTone(300, 0.15, 'sine', 0.15, 80); playTone(600, 0.1, 'square', 0.05, 100); }
        function sndDamage() { playTone(80, 0.3, 'sawtooth', 0.2, 40); playTone(150, 0.2, 'square', 0.1, 30); }
        function sndReload() { setTimeout(()=>playTone(500,0.06,'square',0.08),0); setTimeout(()=>playTone(600,0.06,'square',0.08),120); setTimeout(()=>playTone(800,0.1,'square',0.1),240); }
        function sndWave() { playTone(200,0.4,'sine',0.12,400); setTimeout(()=>playTone(300,0.3,'sine',0.1,600),200); }

        // ---------- Ammo bar ----------
        function initAmmoBar() {
            ammoBar.innerHTML = '';
            for (let i = 0; i < MAX_AMMO; i++) {
                const pip = document.createElement('div');
                pip.className = 'ammo-pip';
                ammoBar.appendChild(pip);
            }
        }
        function updateAmmoBar() {
            const pips = ammoBar.querySelectorAll('.ammo-pip');
            pips.forEach((p, i) => p.classList.toggle('empty', i >= ammo));
        }

        // ---------- Health UI ----------
        function updateHealthUI() {
            const percent = (health / MAX_HEALTH) * 100;
            hpFill.style.width = percent + '%';
            hpNum.textContent = Math.floor(health);
            if (health <= 30) hpFill.classList.add('low');
            else hpFill.classList.remove('low');
        }

        function takeDamage(amount) {
            if (!gameActive) return;
            health = Math.max(0, health - amount);
            updateHealthUI();
            sndDamage();
            const flash = document.createElement('div');
            flash.className = 'damage-flash';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 300);
            if (navigator.vibrate) navigator.vibrate(80);
            if (health <= 0) gameOver();
        }

        // ---------- Enemy: low-poly sphere with wireframe and core ----------
        function createEnemy(pos) {
            const group = new BABYLON.Mesh("enemyGroup", scene);
            const body = BABYLON.MeshBuilder.CreateSphere("body", { diameter: 0.65 }, scene);
            const matBody = new BABYLON.StandardMaterial("bodyMat", scene);
            matBody.diffuseColor = new BABYLON.Color3(0.8, 0.1, 0.1);
            matBody.emissiveColor = new BABYLON.Color3(0.4, 0, 0);
            matBody.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            body.material = matBody;
            body.parent = group;
            
            const wireMat = new BABYLON.StandardMaterial("wireMat", scene);
            wireMat.emissiveColor = new BABYLON.Color3(1, 0.2, 0.2);
            wireMat.wireframe = true;
            const wire = BABYLON.MeshBuilder.CreateSphere("wire", { diameter: 0.72 }, scene);
            wire.material = wireMat;
            wire.parent = group;
            
            const core = BABYLON.MeshBuilder.CreateSphere("core", { diameter: 0.25 }, scene);
            const coreMat = new BABYLON.StandardMaterial("coreMat", scene);
            coreMat.emissiveColor = new BABYLON.Color3(1, 0.4, 0.4);
            coreMat.emissiveIntensity = 0.8;
            core.material = coreMat;
            core.parent = group;
            
            group.position = pos;
            group.userData = {
                speed: 0.028 + Math.random() * 0.015,
                hp: 1,
                core: core,
                wire: wire,
                phase: Math.random() * Math.PI * 2
            };
            return group;
        }

        function spawnEnemy() {
            const radius = 5 + Math.random() * 4;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const x = radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.sin(phi) * Math.sin(theta) * 0.7;
            const z = radius * Math.cos(phi);
            const pos = new BABYLON.Vector3(x, y, z);
            const enemy = createEnemy(pos);
            enemies.push(enemy);
            enemyCountEl.textContent = enemies.length;
        }

        function startWave() {
            wave++;
            waveAlert.textContent = `WAVE ${wave}`;
            waveAlert.classList.add('show');
            sndWave();
            setTimeout(() => waveAlert.classList.remove('show'), 1000);
            const count = Math.min(5 + Math.floor(wave * 0.7), 14);
            for (let i = 0; i < count; i++) {
                setTimeout(() => { if (gameActive) spawnEnemy(); }, i * 250);
            }
        }

        function updateEnemies() {
            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                const dir = e.position.clone().negate();
                const dist = dir.length();
                if (dist > 0.05) dir.normalize();
                e.position.addInPlace(dir.multiplyScalar(e.userData.speed));
                // Animate core and wire
                const time = Date.now() * 0.004;
                const scale = 1 + Math.sin(time + e.userData.phase) * 0.1;
                e.userData.core.scaling = new BABYLON.Vector3(scale, scale, scale);
                e.userData.wire.rotation.y += 0.03;
                e.userData.wire.rotation.x += 0.02;
                // Collision with player
                if (dist < 1.2) {
                    e.dispose();
                    enemies.splice(i,1);
                    i--;
                    takeDamage(15);
                    continue;
                }
            }
            enemyCountEl.textContent = enemies.length;
            if (enemies.length === 0 && !waveCooldown && gameActive) {
                waveCooldown = true;
                sysMsg.textContent = `[SYS] WAVE ${wave} CLEARED`;
                setTimeout(() => {
                    if (gameActive) {
                        waveCooldown = false;
                        startWave();
                    }
                }, 2500);
            }
        }

        // ---------- Shooting ----------
        function shoot() {
            if (!gameActive || isReloading || !canShoot) return;
            if (ammo <= 0) { reload(); return; }
            canShoot = false;
            setTimeout(() => canShoot = true, 150);
            sndShoot();
            // Muzzle flash
            const muzzle = document.createElement('div');
            muzzle.className = 'muzzle';
            document.body.appendChild(muzzle);
            setTimeout(() => muzzle.remove(), 100);
            // Raycast
            const ray = new BABYLON.Ray(camera.position, camera.getForwardRay().direction);
            let hitEnemy = null;
            let hitDist = Infinity;
            for (let enemy of enemies) {
                const boundingSphere = enemy.getBoundingInfo().boundingSphere;
                const centerWorld = enemy.getAbsolutePosition();
                const sphere = new BABYLON.BoundingSphere(centerWorld, boundingSphere.radiusWorld);
                const distance = ray.intersectsSphere(sphere);
                if (distance && distance < hitDist) {
                    hitDist = distance;
                    hitEnemy = enemy;
                }
            }
            if (hitEnemy) {
                const idx = enemies.indexOf(hitEnemy);
                if (idx !== -1) {
                    hitEnemy.dispose();
                    enemies.splice(idx, 1);
                    score += 100;
                    updateUI();
                    sndHit();
                    const hitDiv = document.createElement('div');
                    hitDiv.className = 'hit-effect';
                    hitDiv.textContent = '+100';
                    document.body.appendChild(hitDiv);
                    setTimeout(() => hitDiv.remove(), 800);
                    if (navigator.vibrate) navigator.vibrate(30);
                }
            }
            ammo--;
            updateUI();
            if (ammo === 0) reload();
        }

        function reload() {
            if (isReloading) return;
            isReloading = true;
            reloadInd.style.display = 'flex';
            sndReload();
            setTimeout(() => {
                ammo = MAX_AMMO;
                isReloading = false;
                reloadInd.style.display = 'none';
                updateUI();
            }, 1200);
        }

        function updateUI() {
            scoreEl.textContent = score;
            ammoEl.textContent = `${ammo} / ${MAX_AMMO}`;
            updateAmmoBar();
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('final-score').textContent = `PUNTUACIÓN: ${score}`;
            gameoverScreen.style.display = 'flex';
        }

        function restart() {
            health = MAX_HEALTH;
            score = 0;
            ammo = MAX_AMMO;
            wave = 0;
            waveCooldown = false;
            enemies.forEach(e => e.dispose());
            enemies = [];
            updateHealthUI();
            updateUI();
            gameoverScreen.style.display = 'none';
            gameActive = true;
            startWave();
        }

        // ---------- Camera and gyroscope ----------
        function calibrateCamera() {
            if (camera) {
                camera.rotation.y = 0;
                camera.rotation.x = 0;
                cameraRotation.y = 0;
                cameraRotation.x = 0;
                gyroStatus.textContent = 'CALIBRADO';
                setTimeout(() => {
                    if (gameActive) gyroStatus.textContent = useTouchFallback ? 'INPUT: TÁCTIL' : 'SENSOR: ACTIVO';
                }, 1000);
            }
        }

        function initTouchFallback() {
            useTouchFallback = true;
            ctrlHint.textContent = 'ARRASTRAR: GIRAR | TOCAR: DISPARAR';
            gyroStatus.textContent = 'INPUT: TÁCTIL';
            const canvas = document.getElementById('renderCanvas');
            let isDragging = false;
            let lastX = 0, lastY = 0;
            canvas.addEventListener('touchstart', (e) => {
                if (!gameActive) return;
                isDragging = true;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                e.preventDefault();
            });
            canvas.addEventListener('touchmove', (e) => {
                if (!gameActive || !isDragging) return;
                const dx = e.touches[0].clientX - lastX;
                const dy = e.touches[0].clientY - lastY;
                if (camera) {
                    camera.rotation.y += dx * 0.005;
                    camera.rotation.x += dy * 0.005;
                    camera.rotation.x = Math.min(Math.PI/2.2, Math.max(-Math.PI/2.2, camera.rotation.x));
                }
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                e.preventDefault();
            });
            canvas.addEventListener('touchend', () => isDragging = false);
            // Mouse
            let mouseDown = false;
            canvas.addEventListener('mousedown', (e) => { if (gameActive) mouseDown = true; });
            canvas.addEventListener('mousemove', (e) => {
                if (!gameActive || !mouseDown) return;
                if (camera) {
                    camera.rotation.y += e.movementX * 0.005;
                    camera.rotation.x += e.movementY * 0.005;
                    camera.rotation.x = Math.min(Math.PI/2.2, Math.max(-Math.PI/2.2, camera.rotation.x));
                }
            });
            canvas.addEventListener('mouseup', () => mouseDown = false);
        }

        // ---------- Babylon.js scene ----------
        async function initBabylon() {
            const canvas = document.getElementById('renderCanvas');
            engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: false });
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);
            scene.autoClear = true;
            
            // Camera: DeviceOrientationCamera for true AR
            try {
                camera = new BABYLON.DeviceOrientationCamera("arCamera", new BABYLON.Vector3(0, 0, 0), scene);
                camera.angularSensibility = 5000;
                camera.inputs.add(new BABYLON.DeviceOrientationCameraInput());
                camera.attachControl(canvas, true);
                gyroStatus.textContent = 'SENSOR: ACTIVO';
                ctrlHint.textContent = 'GIROSCOPIO: ACTIVO';
                useTouchFallback = false;
            } catch(e) {
                console.warn("DeviceOrientationCamera fallback to touch", e);
                useTouchFallback = true;
                camera = new BABYLON.UniversalCamera("cam", new BABYLON.Vector3(0, 0, 0), scene);
                camera.attachControl(canvas, true);
                initTouchFallback();
            }
            
            // Lighting
            const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.6;
            const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(1, -1, 0.5), scene);
            dirLight.intensity = 0.8;
            
            // Reference grid
            const grid = BABYLON.MeshBuilder.CreateGround("grid", { width: 20, height: 20, subdivisions: 2 }, scene);
            const gridMat = new BABYLON.StandardMaterial("gridMat", scene);
            gridMat.wireframe = true;
            gridMat.emissiveColor = new BABYLON.Color3(0.2, 0.5, 0.2);
            grid.material = gridMat;
            grid.position.y = -2;
            grid.visibility = 0.3;
            
            // Floating particles (atmosphere)
            const particleCount = 400;
            for (let i = 0; i < particleCount; i++) {
                const sphere = BABYLON.MeshBuilder.CreateSphere("p"+i, { diameter: 0.06 }, scene);
                const r = 4 + Math.random() * 6;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                sphere.position.x = r * Math.sin(phi) * Math.cos(theta);
                sphere.position.y = r * Math.sin(phi) * Math.sin(theta) * 0.6;
                sphere.position.z = r * Math.cos(phi);
                const mat = new BABYLON.StandardMaterial("pMat"+i, scene);
                mat.emissiveColor = new BABYLON.Color3(Math.random()*0.5+0.3, Math.random()*0.8+0.2, Math.random()*0.8+0.2);
                mat.alpha = 0.5;
                sphere.material = mat;
            }
        }

        // ---------- Camera feed ----------
        async function initCameraFeed() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: 'environment' } } });
                video.srcObject = stream;
                return true;
            } catch(e) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                    return true;
                } catch(e2) {
                    video.style.display = 'none';
                    return false;
                }
            }
        }

        // ---------- Events ----------
        function attachEvents() {
            const canvas = document.getElementById('renderCanvas');
            canvas.addEventListener('touchstart', (e) => {
                const now = Date.now();
                if (now - lastTapTime < 250) {
                    calibrateCamera();
                    e.preventDefault();
                } else {
                    shoot();
                }
                lastTapTime = now;
            });
            canvas.addEventListener('click', (e) => {
                if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
                shoot();
            });
            window.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') reload();
                if (e.key === 'c' || e.key === 'C') calibrateCamera();
                if (e.key === ' ') shoot();
            });
        }

        // ---------- Main init with timeout and error handling ----------
        async function init() {
            startBtn.textContent = 'CONECTANDO...';
            startBtn.disabled = true;
            initAudio();
            
            // Timeout to avoid freezing
            const timeout = setTimeout(() => {
                console.warn("Camera timeout, continuing without feed");
                video.style.display = 'none';
                proceed();
            }, 5000);
            
            try {
                await initCameraFeed();
                clearTimeout(timeout);
            } catch(err) {
                clearTimeout(timeout);
                video.style.display = 'none';
            }
            
            async function proceed() {
                try {
                    await initBabylon();
                } catch(err) {
                    console.error("Babylon init failed", err);
                    startBtn.disabled = false;
                    startBtn.textContent = "REINTENTAR";
                    return;
                }
                attachEvents();
                initAmmoBar();
                updateHealthUI();
                updateUI();
                startScreen.style.display = 'none';
                gameActive = true;
                startWave();
                engine.runRenderLoop(() => {
                    if (scene && gameActive) {
                        updateEnemies();
                        scene.render();
                    } else if (scene) {
                        scene.render();
                    }
                });
                window.addEventListener('resize', () => engine.resize());
            }
            proceed();
        }
        
        startBtn.addEventListener('click', init);
        restartBtn.addEventListener('click', restart);
    })();
</script>
</body>
</html>
