<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEO·PROXY COMBAT // GYRO AR MODE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Courier New', 'SF Mono', monospace;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
        }

        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(1.05) contrast(1.1);
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: block;
        }

        .hud {
            position: absolute;
            z-index: 3;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(6px);
            background: rgba(0, 0, 0, 0.65);
            border-left: 3px solid #ff2a2a;
            padding: 8px 16px;
            color: #ff3a3a;
            text-shadow: 0 0 6px #ff0000;
            font-size: 14px;
        }

        .top-bar {
            top: 18px;
            left: 18px;
            right: 18px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-left: none;
            border-right: 3px solid #ff2a2a;
            border-bottom: 1px solid #ff2a2a;
            background: rgba(0, 0, 0, 0.8);
        }

        .score-label {
            font-size: 1.3rem;
            letter-spacing: 2px;
        }

        .bottom-left {
            bottom: 20px;
            left: 20px;
            font-size: 11px;
            border-left: 3px solid #ff2a2a;
        }

        .bottom-right {
            bottom: 20px;
            right: 20px;
            font-size: 16px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.8);
        }

        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            opacity: 0.9;
        }
        .crosshair svg {
            filter: drop-shadow(0 0 3px #ff0000);
        }

        .reload-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: monospace;
            font-size: 1.8rem;
            font-weight: bold;
            background: black;
            padding: 12px 24px;
            border: 2px solid #ff0000;
            color: #ff5555;
            z-index: 20;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 0 12px red;
            letter-spacing: 4px;
            backdrop-filter: blur(8px);
            display: none;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; text-shadow: 0 0 4px red; }
            100% { opacity: 1; text-shadow: 0 0 16px #ff4444; }
        }

        .hit-flash {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff0000;
            background: rgba(0,0,0,0.7);
            padding: 12px 28px;
            border: 1px solid #ff0000;
            white-space: nowrap;
            font-family: monospace;
            z-index: 15;
            pointer-events: none;
            animation: fadeOutUp 0.9s forwards;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        @keyframes fadeOutUp {
            0% { opacity: 1; transform: translate(-50%, -50%); }
            100% { opacity: 0; transform: translate(-50%, -80%); }
        }

        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0101 0%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            backdrop-filter: blur(2px);
            font-family: monospace;
            transition: 0.4s ease;
        }

        .glitch-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff2a2a;
            text-shadow: 3px 3px 0 #7a0000, -2px -2px 0 #ff8888;
            margin-bottom: 40px;
            letter-spacing: 6px;
            animation: textGlitch 1.2s infinite;
        }

        @keyframes textGlitch {
            0% { text-shadow: 2px 2px 0 #aa0000; }
            25% { text-shadow: -2px -1px 0 #ff4444, 1px 1px 0 #660000; }
            50% { text-shadow: 3px -1px 0 #aa2a2a; }
            75% { text-shadow: -1px 2px 0 #ff1a1a; }
            100% { text-shadow: 2px 2px 0 #aa0000; }
        }

        #start-button {
            background: #000000cc;
            color: #ff2a2a;
            border: 2px solid #ff2a2a;
            padding: 16px 42px;
            font-family: monospace;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 5px;
            transition: 0.2s;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 12px rgba(255,0,0,0.4);
        }

        #start-button:hover {
            background: #ff2a2a;
            color: black;
            box-shadow: 0 0 28px #ff2a2a;
            transform: scale(0.98);
        }

        .instruction-tag {
            margin-top: 30px;
            color: #aa2222;
            font-size: 0.8rem;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            text-align: center;
        }

        #game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 200;
            font-family: monospace;
        }

        #game-over h1 {
            color: #ff0000;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px red;
        }

        #final-score {
            color: #ff6666;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        #restart-btn, #calibrate-btn {
            background: #000;
            color: #ff0000;
            border: 2px solid #ff0000;
            padding: 12px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            font-family: monospace;
            margin: 10px;
        }

        .gyro-status {
            position: absolute;
            top: 80px;
            right: 18px;
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            font-size: 9px;
            color: #ff6666;
            z-index: 3;
            border-radius: 4px;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .glitch-title { font-size: 1.8rem; letter-spacing: 3px; }
            #start-button { padding: 12px 28px; font-size: 1.1rem; }
            .bottom-right { font-size: 12px; }
            .hit-flash { font-size: 1rem; padding: 6px 14px; white-space: nowrap; }
            .reload-indicator { font-size: 1.2rem; padding: 8px 18px; }
        }
    </style>
</head>
<body>

<video id="camera-feed" autoplay playsinline muted></video>
<canvas id="game-canvas"></canvas>

<div class="hud top-bar">
    <div>⧉ NEO·PROXY // GYRO AR</div>
    <div id="score" class="score-label">SCORE: 0</div>
</div>

<div class="crosshair">
    <svg width="48" height="48" viewBox="0 0 48 48">
        <line x1="24" y1="8" x2="24" y2="20" stroke="#ff3333" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="24" y1="28" x2="24" y2="40" stroke="#ff3333" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="8" y1="24" x2="20" y2="24" stroke="#ff3333" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="28" y1="24" x2="40" y2="24" stroke="#ff3333" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="24" cy="24" r="7" fill="none" stroke="#ff4444" stroke-width="1.5" stroke-dasharray="2 2"/>
    </svg>
</div>

<div class="hud bottom-left">
    <div>🎮 GYRO ACTIVE // MOVE PHONE TO AIM</div>
    <div style="font-size: 9px;">⟳ R | TAP TO FIRE | CALIBRATE: LONG PRESS</div>
</div>

<div class="hud bottom-right">
    <div id="ammo">🔫 AMMO: 12 / 12</div>
    <div id="wave-info" style="font-size: 9px; margin-top: 4px;">SPEED LVL 1</div>
</div>

<div class="gyro-status" id="gyro-status">⚡ GYRO: CALIBRATING...</div>

<div id="reload-indicator" class="reload-indicator">⟳ RELOADING... ⟳</div>

<div id="start-overlay">
    <div class="glitch-title">// NEO·PROXY COMBAT \\</div>
    <button id="start-button">⟡ INITIALIZE GYRO AR ⟡</button>
    <div class="instruction-tag">[ GIRO + ACELERÓMETRO ] — MUVE EL CELULAR PARA APUNTAR</div>
</div>

<div id="game-over">
    <h1>💀 GAME OVER 💀</h1>
    <div id="final-score">SCORE: 0</div>
    <button id="restart-btn">⟳ RESTART MISSION ⟳</button>
    <button id="calibrate-btn">🎯 CALIBRATE GYRO</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    (function(){
        // ------------------- GLOBAL STATE -------------------
        let scene, camera, renderer, raycaster;
        let enemies = [];
        let score = 0;
        let ammo = 12;
        const MAX_AMMO = 12;
        let isReloading = false;
        let gameActive = false;
        let approachSpeed = 0.008;
        let speedMultiplier = 1.0;
        let lastSpeedIncrease = Date.now();
        
        // Gyroscope variables
        let targetRotationX = 0;    // beta (front-back)
        let targetRotationY = 0;    // gamma (left-right)
        let currentRotationX = 0;
        let currentRotationY = 0;
        let gyroEnabled = false;
        let calibrationOffsetX = 0;
        let calibrationOffsetY = 0;
        let initialBeta = null;
        let initialGamma = null;
        
        // Smoothing factor (low-pass filter)
        const SMOOTHING = 0.12;
        
        // DOM elements
        const scoreEl = document.getElementById('score');
        const ammoEl = document.getElementById('ammo');
        const waveInfo = document.getElementById('wave-info');
        const reloadIndicator = document.getElementById('reload-indicator');
        const startOverlay = document.getElementById('start-overlay');
        const gameOverlay = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');
        const startBtn = document.getElementById('start-button');
        const restartBtn = document.getElementById('restart-btn');
        const calibrateBtn = document.getElementById('calibrate-btn');
        const gyroStatus = document.getElementById('gyro-status');
        const videoFeed = document.getElementById('camera-feed');
        
        // ------------------- GYROSCOPE INITIALIZATION -------------------
        function requestGyroPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS needs explicit permission
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            gyroEnabled = true;
                            gyroStatus.textContent = '🎯 GYRO: ACTIVE';
                        }
                    })
                    .catch(console.error);
            } else {
                // Android and other devices
                window.addEventListener('deviceorientation', handleOrientation);
                gyroEnabled = true;
                gyroStatus.textContent = '🎯 GYRO: ACTIVE';
            }
        }
        
        function handleOrientation(event) {
            if (!gameActive) return;
            
            // beta: front-back (-180 to 180) - rotation around X axis
            // gamma: left-right (-90 to 90) - rotation around Y axis
            let beta = event.beta;
            let gamma = event.gamma;
            
            if (beta === null || gamma === null) return;
            
            // calibrate with initial values
            if (initialBeta === null && gameActive) {
                initialBeta = beta;
                initialGamma = gamma;
                gyroStatus.textContent = '🎯 GYRO: CALIBRATED';
                setTimeout(() => {
                    if(gyroStatus) gyroStatus.style.opacity = '0.7';
                }, 2000);
            }
            
            // apply calibration offset
            let rawX = (beta || 0) - (initialBeta || 0);
            let rawY = (gamma || 0) - (initialGamma || 0);
            
            // apply additional manual offset
            rawX -= calibrationOffsetX;
            rawY -= calibrationOffsetY;
            
            // clamp values for realistic movement (±45 degrees max for comfort)
            const maxAngle = 45;
            targetRotationX = Math.min(maxAngle, Math.max(-maxAngle, rawX * 0.8));
            targetRotationY = Math.min(maxAngle, Math.max(-maxAngle, rawY * 0.8));
        }
        
        function calibrateGyro() {
            // reset offsets to current position
            calibrationOffsetX = 0;
            calibrationOffsetY = 0;
            initialBeta = null;
            initialGamma = null;
            targetRotationX = 0;
            targetRotationY = 0;
            currentRotationX = 0;
            currentRotationY = 0;
            gyroStatus.textContent = '🎯 GYRO: RECALIBRATING...';
            setTimeout(() => {
                if(gyroStatus) gyroStatus.textContent = '🎯 GYRO: ACTIVE';
            }, 1500);
        }
        
        // ------------------- CREATE ENEMIES -------------------
        function getRandomEnemyGeometry() {
            const r = Math.random();
            if (r < 0.4) {
                return new THREE.TorusKnotGeometry(0.42, 0.12, 140, 12, 3, 4);
            } else if (r < 0.7) {
                return new THREE.IcosahedronGeometry(0.38, 0);
            } else {
                return new THREE.DodecahedronGeometry(0.36, 0);
            }
        }
        
        function createEnemy() {
            let geometry = getRandomEnemyGeometry();
            const material = new THREE.MeshStandardMaterial({
                color: 0xcc1a1a,
                emissive: 0x441111,
                emissiveIntensity: 0.55,
                metalness: 0.7,
                roughness: 0.35
            });
            
            const enemyMesh = new THREE.Mesh(geometry, material);
            
            enemyMesh.position.x = (Math.random() - 0.5) * 7.2;
            enemyMesh.position.y = (Math.random() - 0.5) * 5.2;
            enemyMesh.position.z = 5 + Math.random() * 4;
            
            enemyMesh.rotation.x = Math.random() * Math.PI * 2;
            enemyMesh.rotation.y = Math.random() * Math.PI * 2;
            enemyMesh.rotation.z = Math.random() * Math.PI * 2;
            
            enemyMesh.userData = {
                type: 'APPROACHER',
                rotationSpeed: 0.008 + Math.random() * 0.012,
                lastGlitchTime: Date.now(),
                glitchInterval: 1800 + Math.random() * 1800,
                originalScale: 0.9 + Math.random() * 0.5,
                pulsePhase: Math.random() * Math.PI * 2
            };
            
            const randScale = enemyMesh.userData.originalScale;
            enemyMesh.scale.set(randScale, randScale, randScale);
            
            return enemyMesh;
        }
        
        function initEnemies(count = 5) {
            enemies.forEach(e => scene.remove(e));
            enemies = [];
            for(let i = 0; i < count; i++) {
                const enemy = createEnemy();
                scene.add(enemy);
                enemies.push(enemy);
            }
        }
        
        function spawnNewEnemy() {
            const newEnemy = createEnemy();
            scene.add(newEnemy);
            enemies.push(newEnemy);
        }
        
        // ------------------- GAME OVER -------------------
        function endGame() {
            gameActive = false;
            finalScoreEl.textContent = `SCORE: ${score}`;
            gameOverlay.style.display = 'flex';
        }
        
        function restartGame() {
            score = 0;
            ammo = MAX_AMMO;
            approachSpeed = 0.008;
            speedMultiplier = 1.0;
            lastSpeedIncrease = Date.now();
            updateUI();
            
            enemies.forEach(e => scene.remove(e));
            enemies = [];
            initEnemies(5);
            
            // reset gyro calibration
            initialBeta = null;
            initialGamma = null;
            targetRotationX = 0;
            targetRotationY = 0;
            currentRotationX = 0;
            currentRotationY = 0;
            
            gameActive = true;
            gameOverlay.style.display = 'none';
            gyroStatus.textContent = '🎯 GYRO: ACTIVE';
        }
        
        // ------------------- MECÁNICAS -------------------
        function showHitFlash() {
            const flashDiv = document.createElement('div');
            flashDiv.className = 'hit-flash';
            flashDiv.textContent = '⚡ ELIMINATED ⚡';
            document.body.appendChild(flashDiv);
            setTimeout(() => {
                if(flashDiv && flashDiv.remove) flashDiv.remove();
            }, 800);
        }
        
        function updateUI() {
            scoreEl.textContent = `SCORE: ${score}`;
            ammoEl.textContent = `🔫 AMMO: ${ammo} / ${MAX_AMMO}`;
            const speedLevel = Math.floor(speedMultiplier * 10) / 10;
            waveInfo.textContent = `⚡ SPEED LVL ${speedLevel.toFixed(1)}x`;
        }
        
        function eliminateEnemy(enemyMesh) {
            if (!enemyMesh || !enemyMesh.parent) return false;
            
            scene.remove(enemyMesh);
            const idx = enemies.indexOf(enemyMesh);
            if(idx !== -1) enemies.splice(idx, 1);
            
            score += 100;
            updateUI();
            showHitFlash();
            
            setTimeout(() => {
                if(gameActive) {
                    spawnNewEnemy();
                }
            }, 300);
            return true;
        }
        
        function reloadGun() {
            if(isReloading) return;
            if(ammo === MAX_AMMO) return;
            
            isReloading = true;
            reloadIndicator.style.display = 'flex';
            
            setTimeout(() => {
                ammo = MAX_AMMO;
                isReloading = false;
                reloadIndicator.style.display = 'none';
                updateUI();
            }, 2000);
        }
        
        // SHOOTING with raycasting from camera center
        function handleShoot(event) {
            if(!gameActive) return;
            if(isReloading) return;
            if(ammo <= 0) {
                reloadGun();
                return;
            }
            
            // Ray from center of screen (camera direction)
            const center = new THREE.Vector2(0, 0);
            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(enemies);
            
            if(intersects.length > 0) {
                const hitEnemy = intersects[0].object;
                eliminateEnemy(hitEnemy);
                ammo--;
                updateUI();
                
                // visual feedback: crosshair flash
                const crosshairSvg = document.querySelector('.crosshair svg');
                if(crosshairSvg) {
                    crosshairSvg.style.transform = 'scale(0.85)';
                    setTimeout(() => { if(crosshairSvg) crosshairSvg.style.transform = ''; }, 80);
                }
                
                if(ammo === 0) {
                    reloadGun();
                }
            }
        }
        
        // ------------------- ANIMACIÓN Y ACERCAMIENTO -------------------
        function updateEnemies(currentTime) {
            const now = currentTime;
            
            if(now - lastSpeedIncrease > 5000 && gameActive) {
                speedMultiplier += 0.15;
                if(speedMultiplier > 2.5) speedMultiplier = 2.5;
                lastSpeedIncrease = now;
                updateUI();
            }
            
            const currentSpeed = approachSpeed * speedMultiplier;
            
            for(let i = 0; i < enemies.length; i++) {
                const enemy = enemies[i];
                if(!enemy) continue;
                const data = enemy.userData;
                
                enemy.position.z -= currentSpeed;
                
                const distance = Math.max(0.5, enemy.position.z);
                const scaleFactor = Math.min(1.8, 1.2 + (5 - Math.min(5, distance)) * 0.15);
                const targetScale = data.originalScale * scaleFactor;
                enemy.scale.setScalar(targetScale);
                
                if(enemy.position.z < 0.8) {
                    endGame();
                    return;
                }
                
                if(enemy.position.z > 9) {
                    enemy.position.z = 5;
                }
                
                enemy.position.x += (Math.random() - 0.5) * 0.006;
                enemy.position.y += (Math.random() - 0.5) * 0.006;
                enemy.position.x = Math.min(Math.max(enemy.position.x, -5.5), 5.5);
                enemy.position.y = Math.min(Math.max(enemy.position.y, -4), 4);
                
                const timeSec = now * 0.002;
                const rotMod = Math.sin(timeSec + data.pulsePhase) * 0.015;
                enemy.rotation.x += data.rotationSpeed * 0.7 + rotMod * 0.02;
                enemy.rotation.y += data.rotationSpeed + Math.sin(timeSec * 1.3) * 0.005;
                enemy.rotation.z += data.rotationSpeed * 0.5;
                
                if(now - data.lastGlitchTime > data.glitchInterval) {
                    const glitchScale = 1.3 + Math.random() * 0.5;
                    enemy.scale.setScalar(glitchScale);
                    
                    if(enemy.material) {
                        const originalEmissive = enemy.material.emissiveIntensity || 0.55;
                        enemy.material.emissiveIntensity = 1.2;
                        enemy.material.color.setHex(0xff4444);
                        setTimeout(() => {
                            if(enemy.material) {
                                enemy.material.emissiveIntensity = originalEmissive;
                                enemy.material.color.setHex(0xcc1a1a);
                            }
                        }, 120);
                    }
                    
                    setTimeout(() => {
                        if(enemy && enemy.scale) {
                            const finalScale = data.originalScale * Math.min(1.8, 1.2 + (5 - Math.min(5, enemy.position.z)) * 0.15);
                            enemy.scale.setScalar(finalScale);
                        }
                    }, 150);
                    
                    data.lastGlitchTime = now;
                    data.glitchInterval = 1400 + Math.random() * 2200;
                }
                
                if(enemy.material) {
                    const intensity = 0.5 + Math.sin(Date.now() * 0.006 + data.pulsePhase) * 0.3;
                    enemy.material.emissiveIntensity = Math.min(1.0, Math.max(0.3, intensity));
                }
            }
        }
        
        // ------------------- THREE.JS -------------------
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.2, 20);
            camera.position.set(0, 0, 5);
            
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('game-canvas'),
                alpha: true,
                antialias: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            
            raycaster = new THREE.Raycaster();
            
            const ambient = new THREE.AmbientLight(0x332222);
            scene.add(ambient);
            const mainLight = new THREE.DirectionalLight(0xffaa88, 1.2);
            mainLight.position.set(2, 3, 4);
            scene.add(mainLight);
            const fillLight = new THREE.PointLight(0x992222, 0.5);
            fillLight.position.set(1, 2, 3);
            scene.add(fillLight);
            const backLight = new THREE.PointLight(0xff3333, 0.4);
            backLight.position.set(-1, 1, -2);
            scene.add(backLight);
            
            scene.fog = new THREE.FogExp2(0x000000, 0.02);
        }
        
        // ------------------- CAMARA -------------------
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
                videoFeed.srcObject = stream;
                return true;
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    videoFeed.srcObject = fallbackStream;
                    return true;
                } catch (err2) {
                    videoFeed.style.display = "none";
                    return false;
                }
            }
        }
        
        // ------------------- ANIMATION LOOP -------------------
        function animate() {
            requestAnimationFrame(animate);
            
            if(!gameActive) {
                renderer.render(scene, camera);
                return;
            }
            
            // Smooth gyro interpolation
            currentRotationX += (targetRotationX - currentRotationX) * SMOOTHING;
            currentRotationY += (targetRotationY - currentRotationY) * SMOOTHING;
            
            // Apply rotation to camera (AR style)
            camera.rotation.order = 'YXZ';
            camera.rotation.x = currentRotationX * Math.PI / 180;
            camera.rotation.y = currentRotationY * Math.PI / 180;
            camera.rotation.z = 0;
            
            const now = Date.now();
            updateEnemies(now);
            renderer.render(scene, camera);
        }
        
        // ------------------- INICIALIZAR JUEGO -------------------
        async function initializeGame() {
            startBtn.textContent = "⟡ LINKING ⟡";
            startBtn.disabled = true;
            
            await startCamera();
            initThree();
            initEnemies(5);
            
            gameActive = true;
            lastSpeedIncrease = Date.now();
            approachSpeed = 0.008;
            speedMultiplier = 1.0;
            
            // request gyro permission for iOS
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    await DeviceOrientationEvent.requestPermission();
                    window.addEventListener('deviceorientation', handleOrientation);
                    gyroEnabled = true;
                    gyroStatus.textContent = '🎯 GYRO: ACTIVE';
                } catch(e) {
                    gyroStatus.textContent = '⚠️ GYRO: MANUAL ONLY';
                }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                gyroEnabled = true;
                gyroStatus.textContent = '🎯 GYRO: ACTIVE';
            }
            
            animate();
            
            window.addEventListener('resize', () => {
                if(camera && renderer) {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
            });
            
            document.addEventListener('click', handleShoot);
            document.addEventListener('touchstart', handleShoot, { passive: false });
            
            // Long press calibration
            let pressTimer;
            document.addEventListener('touchstart', (e) => {
                if(e.touches.length === 2) {
                    pressTimer = setTimeout(() => {
                        calibrateGyro();
                    }, 800);
                }
            });
            document.addEventListener('touchend', () => {
                clearTimeout(pressTimer);
            });
            
            window.addEventListener('keydown', (e) => {
                if(!gameActive) return;
                if(e.key === 'r' || e.key === 'R') {
                    e.preventDefault();
                    reloadGun();
                }
                if(e.key === 'c' || e.key === 'C') {
                    calibrateGyro();
                }
            });
            
            updateUI();
            startOverlay.style.opacity = '0';
            setTimeout(() => {
                startOverlay.style.display = 'none';
            }, 500);
            startBtn.disabled = false;
        }
        
        startBtn.addEventListener('click', () => {
            initializeGame().catch(err => {
                console.error(err);
                startBtn.textContent = "⚠️ RETRY";
                startBtn.disabled = false;
            });
        });
        
        restartBtn.addEventListener('click', () => {
            restartGame();
        });
        
        calibrateBtn.addEventListener('click', () => {
            calibrateGyro();
        });
    })();
</script>
</body>
