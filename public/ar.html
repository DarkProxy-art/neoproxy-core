<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEO·PROXY // THE WIRED</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Courier New', monospace; 
            background: #000; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh; 
            position: fixed;
            touch-action: none;
        }
        
        /* Capas de ruido y scanlines */
        .noise-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjciIG51bU9jdGF2ZXM9IjMiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjZikiIG9wYWNpdHk9IjAuMDYiLz48L3N2Zz4=');
            background-repeat: repeat;
            opacity: 0.2;
            pointer-events: none;
            z-index: 20;
            mix-blend-mode: overlay;
            animation: staticShift 0.3s steps(3) infinite;
        }
        
        @keyframes staticShift {
            0% { transform: translate(0,0); opacity: 0.2; }
            50% { transform: translate(2px, -1px); opacity: 0.25; }
            100% { transform: translate(-1px, 1px); opacity: 0.2; }
        }
        
        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 2px, transparent 2px, transparent 6px);
            pointer-events: none;
            z-index: 21;
            opacity: 0.7;
        }
        
        /* Filtro de color global (estilo sombrío) */
        .color-filter {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            backdrop-filter: brightness(0.85) contrast(1.2) saturate(0.6) hue-rotate(5deg);
            pointer-events: none;
            z-index: 22;
            mix-blend-mode: multiply;
        }
        
        /* Chromatic aberration al recibir daño */
        .chromatic-aberration {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 25;
            animation: chromaAnim 0.2s ease-out forwards;
        }
        
        @keyframes chromaAnim {
            0% { background: radial-gradient(circle, rgba(255,0,0,0.2) 0%, rgba(0,255,0,0.2) 30%, rgba(0,0,255,0.2) 70%); transform: scale(1.02); filter: blur(2px); }
            100% { background: transparent; transform: scale(1); filter: blur(0); }
        }
        
        #camera-feed { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            z-index: 1;
            filter: grayscale(0.3) contrast(1.1);
        }
        
        #game-canvas { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: 2;
        }
        
        /* HUD con efecto glitch */
        .hud { 
            position: absolute; 
            z-index: 30; 
            pointer-events: none; 
            font-family: 'Courier New', monospace; 
            font-weight: bold;
            color: #88ff99;
            text-shadow: 0 0 5px #2aff66, 0 0 2px #00aa44;
            font-size: 14px;
            letter-spacing: 2px;
            background: rgba(0,20,10,0.65);
            backdrop-filter: blur(3px);
            padding: 8px 16px;
            border-left: 2px solid #88ff99;
            border-bottom: 1px solid #88ff99;
        }
        
        .glitch-text {
            animation: textGlitch 0.15s steps(1) infinite;
            display: inline-block;
        }
        
        @keyframes textGlitch {
            0%, 100% { transform: translate(0,0); text-shadow: 2px 0 red, -2px 0 blue; }
            25% { transform: translate(-1px, 1px); text-shadow: -2px 0 red, 2px 0 blue; }
            50% { transform: translate(1px, -1px); text-shadow: 2px 0 cyan, -2px 0 magenta; }
            75% { transform: translate(0, 1px); text-shadow: -1px 0 red, 1px 0 blue; }
        }
        
        .top-bar { 
            top: 18px; left: 18px; right: 18px; 
            display: flex; 
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0,20,10,0.8);
            border: 1px solid #88ff99;
            border-radius: 0px;
        }
        
        .health-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .health-bar-bg {
            width: 180px;
            height: 18px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #88ff99;
        }
        
        .health-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #88ff99, #2aff66);
            transition: width 0.2s ease;
        }
        
        .bottom-left { 
            bottom: 20px; left: 20px; 
            font-size: 11px; 
            padding: 10px 16px;
            background: rgba(0,20,10,0.8);
            border-left: 3px solid #88ff99;
        }
        
        .bottom-right { 
            bottom: 20px; right: 20px; 
            font-size: 14px;
            text-align: right;
            padding: 12px 16px;
            background: rgba(0,20,10,0.8);
            border-right: 3px solid #88ff99;
        }
        
        .crosshair { 
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            z-index: 10; 
            pointer-events: none;
        }
        
        .reload-indicator { 
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: #000; 
            border: 2px solid #ff4466; 
            color: #ff4466; 
            padding: 16px 32px; 
            z-index: 40; 
            display: none; 
            font-family: monospace; 
            font-size: 1.2rem; 
            text-shadow: 0 0 8px #ff4466;
            animation: reloadPulse 0.6s infinite;
        }
        
        .hit-flash { 
            position: absolute; 
            top: 38%; left: 50%; 
            transform: translate(-50%, -50%); 
            color: #ff4466; 
            background: rgba(0,0,0,0.85); 
            padding: 12px 24px; 
            border: 1px solid #ff4466; 
            z-index: 35; 
            animation: hitAnim 0.9s forwards; 
            font-family: monospace; 
            font-size: 1rem; 
            white-space: nowrap;
        }
        
        .damage-flash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,68,102,0.4) 0%, transparent 70%);
            pointer-events: none;
            z-index: 12;
            animation: damageFlashAnim 0.3s forwards;
        }
        
        .muzzle-flash {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 200px; height: 200px;
            background: radial-gradient(circle, #88ff99 0%, rgba(136,255,153,0.4) 50%, transparent 80%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 11;
            animation: muzzleAnim 0.12s forwards;
        }
        
        #start-overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: #0a0a0a;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
            z-index: 100;
            font-family: monospace;
        }
        
        #start-button { 
            background: transparent; 
            color: #88ff99; 
            border: 2px solid #88ff99; 
            padding: 18px 50px; 
            font-family: monospace; 
            font-size: 1.3rem; 
            cursor: pointer; 
            margin-top: 30px;
            transition: 0.3s;
        }
        
        #game-over { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: #0a0505;
            display: none; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
            z-index: 200;
        }
        
        #restart-btn { 
            background: transparent; 
            color: #ff4466; 
            border: 2px solid #ff4466; 
            padding: 14px 35px; 
            margin-top: 25px; 
            cursor: pointer; 
            font-family: monospace;
        }
        
        .gyro-status { 
            position: absolute; 
            top: 85px; right: 18px; 
            background: rgba(0,20,10,0.7); 
            padding: 6px 12px; 
            font-size: 9px; 
            color: #88ff99; 
            z-index: 3; 
            border-radius: 0px;
        }
        
        .gyro-debug { 
            position: absolute; 
            bottom: 85px; left: 18px; 
            background: rgba(0,20,10,0.7); 
            padding: 6px 12px; 
            font-size: 9px; 
            color: #88ff99; 
            z-index: 3; 
        }
        
        .ammo-bar {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            justify-content: flex-end;
        }
        
        .ammo-bullet {
            width: 6px;
            height: 14px;
            background: #88ff99;
            box-shadow: 0 0 4px #88ff99;
        }
        
        .ammo-bullet.empty {
            background: #2a4a3a;
            box-shadow: none;
        }
        
        .system-message {
            position: absolute;
            bottom: 120px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: #ff6688;
            padding: 4px 10px;
            font-size: 9px;
            font-family: monospace;
            z-index: 30;
            border-left: 2px solid #ff4466;
            max-width: 250px;
            pointer-events: none;
        }
        
        @keyframes reloadPulse {
            0% { opacity: 0.7; text-shadow: 0 0 5px #ff4466; }
            100% { opacity: 1; text-shadow: 0 0 15px #ff4466; }
        }
        @keyframes hitAnim { 0% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%); } }
        @keyframes damageFlashAnim { 0% { opacity: 0.7; } 100% { opacity: 0; } }
        @keyframes muzzleAnim { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.3); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); } }
    </style>
</head>
<body>

<video id="camera-feed" autoplay playsinline muted></video>
<canvas id="game-canvas"></canvas>

<!-- Capas de post-procesado -->
<div class="noise-layer"></div>
<div class="scanlines"></div>
<div class="color-filter"></div>

<div class="hud top-bar">
    <div class="glitch-text">NEO·PROXY // THE WIRED</div>
    <div class="health-container">
        <div class="health-bar-bg"><div class="health-bar-fill" id="health-fill"></div></div>
        <div id="health-text" class="glitch-text">100</div>
        <div id="score" class="glitch-text">ENTROPY: 0</div>
    </div>
</div>

<div class="crosshair">
    <svg width="50" height="50" viewBox="0 0 50 50">
        <circle cx="25" cy="25" r="18" fill="none" stroke="#88ff99" stroke-width="1" opacity="0.6"/>
        <circle cx="25" cy="25" r="10" fill="none" stroke="#88ff99" stroke-width="1.5"/>
        <circle cx="25" cy="25" r="3" fill="#88ff99"/>
        <line x1="25" y1="3" x2="25" y2="12" stroke="#88ff99" stroke-width="2"/>
        <line x1="25" y1="38" x2="25" y2="47" stroke="#88ff99" stroke-width="2"/>
        <line x1="3" y1="25" x2="12" y2="25" stroke="#88ff99" stroke-width="2"/>
        <line x1="38" y1="25" x2="47" y2="25" stroke="#88ff99" stroke-width="2"/>
    </svg>
</div>

<div class="hud bottom-left">
    <div id="control-hint" class="glitch-text">INPUT: GYRO/TOUCH</div>
    <div>TAP: FIRE | DOUBLETAP: CALIBRATE</div>
</div>

<div class="hud bottom-right">
    <div id="ammo" class="glitch-text">ROUNDS: 12/12</div>
    <div class="ammo-bar" id="ammo-bar"></div>
    <div id="enemies-count" style="margin-top: 8px;">THREATS: 0</div>
</div>

<div class="gyro-status" id="gyro-status">SENSOR: INIT</div>
<div class="gyro-debug" id="gyro-debug">AZIMUTH: 0 | ELEV: 0</div>
<div class="system-message" id="sysmsg">[ SYSTEM ] WIRED LINK ESTABLISHED</div>

<div id="reload-indicator" class="reload-indicator">CYCLE RELOAD...</div>

<div id="start-overlay">
    <h1 style="color:#88ff99;">NEO·PROXY</h1>
    <p style="color:#aaeeaa;">ENTER THE WIRED</p>
    <button id="start-button">CONNECT</button>
    <p style="color:#448844;">allow camera & motion</p>
</div>

<div id="game-over">
    <h1 style="color:#ff4466;">MEMORY LEAK</h1>
    <div id="final-score" style="color:#ff8888; font-size:28px;">0</div>
    <button id="restart-btn">REBOOT</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    (function(){
        // ---------- DOM elements ----------
        const videoFeed = document.getElementById('camera-feed');
        const startOverlay = document.getElementById('start-overlay');
        const gameOverlay = document.getElementById('game-over');
        const startBtn = document.getElementById('start-button');
        const restartBtn = document.getElementById('restart-btn');
        const scoreEl = document.getElementById('score');
        const ammoEl = document.getElementById('ammo');
        const ammoBarEl = document.getElementById('ammo-bar');
        const enemiesCountEl = document.getElementById('enemies-count');
        const reloadIndicator = document.getElementById('reload-indicator');
        const gyroStatusEl = document.getElementById('gyro-status');
        const gyroDebugEl = document.getElementById('gyro-debug');
        const healthFill = document.getElementById('health-fill');
        const healthText = document.getElementById('health-text');
        const sysMsg = document.getElementById('sysmsg');
        
        // ---------- Game state ----------
        let scene, camera, renderer;
        let enemies = [];
        let score = 0;
        let ammo = 12;
        const maxAmmo = 12;
        let isReloading = false;
        let gameActive = false;
        let canShoot = true;
        let health = 100;
        const maxHealth = 100;
        
        // Gyro / touch
        let useTouchControls = false;
        let isDragging = false;
        let lastTouchX = 0, lastTouchY = 0;
        const TOUCH_SENSITIVITY = 0.4;
        let currentRotationX = 0, currentRotationY = 0;
        let targetRotationX = 0, targetRotationY = 0;
        let gyroEnabled = false;
        
        // Mensajes narrativos cambiantes
        const sysMessages = [
            "MEMORY LEAK DETECTED", "REALITY.SYS NOT RESPONDING",
            "CONNECTION UNSTABLE", "DATA CORRUPTION",
            "WIRED OVERLAY ACTIVE", "EGO BOUNDARY LOST",
            "COGNITIVE HAZARD", "PSEUDO-SPACE FRAGMENT"
        ];
        let msgInterval;
        
        function updateSystemMessage() {
            if (!gameActive) return;
            const idx = Math.floor(Math.random() * sysMessages.length);
            sysMsg.textContent = `[ SYSTEM ] ${sysMessages[idx]}`;
        }
        
        // Glitch en textos cada cierto tiempo
        function randomGlitchOnElement(el) {
            if (!el) return;
            el.classList.add('glitch-text');
            setTimeout(() => el.classList.remove('glitch-text'), 200);
        }
        
        function periodicUIGlitch() {
            if (!gameActive) return;
            const elements = [scoreEl, ammoEl, healthText, enemiesCountEl];
            const rand = elements[Math.floor(Math.random() * elements.length)];
            if (rand) randomGlitchOnElement(rand);
            setTimeout(periodicUIGlitch, 3000 + Math.random() * 4000);
        }
        
        // Health & damage
        function updateHealthUI() {
            const percent = (health / maxHealth) * 100;
            healthFill.style.width = `${percent}%`;
            healthText.textContent = Math.floor(health);
            if (health <= 30) healthFill.style.background = "linear-gradient(90deg, #ff6688, #ff4466)";
            else healthFill.style.background = "linear-gradient(90deg, #88ff99, #2aff66)";
        }
        
        function damagePlayer(amount) {
            if (!gameActive) return;
            health -= amount;
            if (health <= 0) { health = 0; gameOver(); }
            updateHealthUI();
            // Efecto chromatic aberration y flash
            const ab = document.createElement('div');
            ab.className = 'chromatic-aberration';
            document.body.appendChild(ab);
            setTimeout(() => ab.remove(), 200);
            const flash = document.createElement('div');
            flash.className = 'damage-flash';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 300);
            if (navigator.vibrate) navigator.vibrate(100);
        }
        
        // Ammo bar
        function initAmmoBar() {
            ammoBarEl.innerHTML = '';
            for (let i = 0; i < maxAmmo; i++) {
                const bullet = document.createElement('div');
                bullet.className = 'ammo-bullet';
                ammoBarEl.appendChild(bullet);
            }
        }
        function updateAmmoBar() {
            const bullets = ammoBarEl.querySelectorAll('.ammo-bullet');
            bullets.forEach((b, i) => b.classList.toggle('empty', i >= ammo));
        }
        
        // ---------- ENEMY: Low-poly con wireframe y núcleo ----------
        function createProxyEnemy(startZ) {
            const group = new THREE.Group();
            // Cuerpo principal: Icosaedro oscuro con wireframe brillante
            const geom = new THREE.IcosahedronGeometry(0.48, 0);
            const matBody = new THREE.MeshStandardMaterial({
                color: 0x111111,
                emissive: 0x220000,
                roughness: 0.7,
                metalness: 0.8,
                wireframe: false
            });
            const body = new THREE.Mesh(geom, matBody);
            group.add(body);
            
            // Wireframe exterior (más grande)
            const wireMat = new THREE.MeshBasicMaterial({ color: 0xff3366, wireframe: true, transparent: true, opacity: 0.7 });
            const wireframe = new THREE.Mesh(geom, wireMat);
            wireframe.scale.setScalar(1.08);
            group.add(wireframe);
            
            // Núcleo interno giratorio
            const coreGeom = new THREE.OctahedronGeometry(0.22);
            const coreMat = new THREE.MeshStandardMaterial({ color: 0xff6688, emissive: 0xff2244, emissiveIntensity: 0.9 });
            const core = new THREE.Mesh(coreGeom, coreMat);
            group.add(core);
            
            // Posición aleatoria dentro del cono de visión
            const x = (Math.random() - 0.5) * 5.5;
            const y = (Math.random() - 0.5) * 4;
            group.position.set(x, y, startZ);
            
            group.userData = {
                speed: 0.022 + Math.random() * 0.018,
                startZ: startZ,
                core: core,
                wireframe: wireframe,
                pulsePhase: Math.random() * Math.PI * 2,
                rotSpeed: 0.01 + Math.random() * 0.01
            };
            return group;
        }
        
        function spawnEnemies(count = 8) {
            enemies.forEach(e => scene.remove(e));
            enemies = [];
            for (let i = 0; i < count; i++) {
                const zStart = 7 + Math.random() * 4;
                const enemy = createProxyEnemy(zStart);
                scene.add(enemy);
                enemies.push(enemy);
            }
            updateEnemiesCount();
        }
        
        function respawnEnemy() {
            const zStart = 8 + Math.random() * 3;
            const enemy = createProxyEnemy(zStart);
            scene.add(enemy);
            enemies.push(enemy);
            updateEnemiesCount();
        }
        
        function updateEnemiesCount() {
            enemiesCountEl.textContent = `THREATS: ${enemies.length}`;
        }
        
        function updateEnemiesMovement() {
            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                e.position.z -= e.userData.speed;
                // Rotación y pulsación
                e.userData.core.rotation.x += 0.03;
                e.userData.core.rotation.y += 0.04;
                e.userData.wireframe.rotation.x += 0.01;
                e.userData.wireframe.rotation.y += 0.02;
                const pulse = 1 + Math.sin(Date.now() * 0.008 + e.userData.pulsePhase) * 0.1;
                e.scale.setScalar(pulse);
                
                // Colisión con la cámara
                if (e.position.z < 0.8) {
                    scene.remove(e);
                    enemies.splice(i,1);
                    i--;
                    damagePlayer(20);
                    setTimeout(() => { if (gameActive && enemies.length < 12) respawnEnemy(); }, 200);
                }
            }
            if (gameActive && enemies.length < 5) respawnEnemy();
            updateEnemiesCount();
        }
        
        // ---------- Shooting ----------
        function shoot(e) {
            if (!gameActive || isReloading || !canShoot) return;
            if (e) e.preventDefault();
            if (ammo <= 0) { reload(); return; }
            
            canShoot = false;
            setTimeout(() => canShoot = true, 130);
            
            const flash = document.createElement('div');
            flash.className = 'muzzle-flash';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 120);
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(enemies, true);
            if (intersects.length > 0) {
                let hit = intersects[0].object;
                while (hit.parent && !enemies.includes(hit)) hit = hit.parent;
                const idx = enemies.indexOf(hit);
                if (idx !== -1) {
                    scene.remove(hit);
                    enemies.splice(idx,1);
                    score += 100;
                    updateUI();
                    const hitDiv = document.createElement('div');
                    hitDiv.className = 'hit-flash';
                    hitDiv.textContent = 'FRAGMENTED +100';
                    document.body.appendChild(hitDiv);
                    setTimeout(() => hitDiv.remove(), 800);
                    if (navigator.vibrate) navigator.vibrate(40);
                    setTimeout(() => { if (gameActive) respawnEnemy(); }, 300);
                }
            }
            ammo--;
            updateUI();
            if (ammo === 0) reload();
        }
        
        function reload() {
            if (isReloading) return;
            isReloading = true;
            reloadIndicator.style.display = 'flex';
            if (navigator.vibrate) navigator.vibrate([25,40,25]);
            setTimeout(() => {
                ammo = maxAmmo;
                isReloading = false;
                reloadIndicator.style.display = 'none';
                updateUI();
            }, 1400);
        }
        
        function updateUI() {
            const scoreLabel = Math.random() < 0.2 ? "ENTROPY GAINED" : "DATA CORRUPTED";
            scoreEl.innerHTML = `${scoreLabel}: ${score}`;
            ammoEl.innerHTML = `ROUNDS: ${ammo}/${maxAmmo}`;
            updateAmmoBar();
            randomGlitchOnElement(scoreEl);
        }
        
        function gameOver() {
            gameActive = false;
            clearInterval(msgInterval);
            document.getElementById('final-score').textContent = `SCORE: ${score}`;
            gameOverlay.style.display = 'flex';
        }
        
        function restartGame() {
            health = maxHealth;
            score = 0;
            ammo = maxAmmo;
            updateUI();
            updateHealthUI();
            enemies.forEach(e => scene.remove(e));
            enemies = [];
            spawnEnemies(8);
            gameActive = true;
            gameOverlay.style.display = 'none';
            targetRotationX = targetRotationY = 0;
            currentRotationX = currentRotationY = 0;
            msgInterval = setInterval(updateSystemMessage, 4000);
            periodicUIGlitch();
        }
        
        // Gyroscope & touch
        function handleOrientation(event) {
            if (!gameActive) return;
            let gamma = event.gamma || 0;
            let beta = event.beta || 0;
            let yaw = Math.min(90, Math.max(-90, gamma));
            let pitch = Math.min(60, Math.max(-60, beta));
            targetRotationY = yaw;
            targetRotationX = pitch;
            if (!gyroEnabled && (Math.abs(gamma) > 0.1 || Math.abs(beta) > 0.1)) {
                gyroEnabled = true;
                gyroStatusEl.textContent = "SENSOR: ACTIVE";
            }
            gyroDebugEl.textContent = `AZIMUTH: ${yaw.toFixed(0)} | ELEV: ${pitch.toFixed(0)}`;
        }
        
        function initTouchControls() {
            const canvas = document.getElementById('game-canvas');
            canvas.addEventListener('touchstart', (e) => {
                if (!gameActive || !useTouchControls) return;
                isDragging = true;
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
            }, { passive: true });
            canvas.addEventListener('touchmove', (e) => {
                if (!gameActive || !useTouchControls || !isDragging) return;
                e.preventDefault();
                const dx = (e.touches[0].clientX - lastTouchX) * TOUCH_SENSITIVITY;
                const dy = (e.touches[0].clientY - lastTouchY) * TOUCH_SENSITIVITY;
                targetRotationY += dx * 0.12;
                targetRotationX += dy * 0.12;
                targetRotationY = Math.min(90, Math.max(-90, targetRotationY));
                targetRotationX = Math.min(60, Math.max(-60, targetRotationX));
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
                gyroDebugEl.textContent = `TOUCH | AZ: ${targetRotationY.toFixed(0)} | EL: ${targetRotationX.toFixed(0)}`;
            }, { passive: false });
            canvas.addEventListener('touchend', () => isDragging = false);
            let mouseDown = false;
            canvas.addEventListener('mousedown', (e) => {
                if (!gameActive || !useTouchControls) return;
                mouseDown = true;
                lastTouchX = e.clientX;
                lastTouchY = e.clientY;
            });
            canvas.addEventListener('mousemove', (e) => {
                if (!gameActive || !useTouchControls || !mouseDown) return;
                const dx = (e.clientX - lastTouchX) * TOUCH_SENSITIVITY;
                const dy = (e.clientY - lastTouchY) * TOUCH_SENSITIVITY;
                targetRotationY += dx * 0.12;
                targetRotationX += dy * 0.12;
                lastTouchX = e.clientX;
                lastTouchY = e.clientY;
            });
            canvas.addEventListener('mouseup', () => mouseDown = false);
        }
        
        function calibrateGyro() {
            targetRotationX = targetRotationY = 0;
            currentRotationX = currentRotationY = 0;
            gyroStatusEl.textContent = "SENSOR: CALIBRATED";
            setTimeout(() => { if (gyroStatusEl && gameActive) gyroStatusEl.textContent = useTouchControls ? "INPUT: TOUCH" : "SENSOR: ACTIVE"; }, 1500);
        }
        
        // Three.js
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0,0,0);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            
            const ambient = new THREE.AmbientLight(0x112211);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0x88ffaa, 0.8);
            dirLight.position.set(1,2,3);
            scene.add(dirLight);
            const fillLight = new THREE.PointLight(0x88ff99, 0.4);
            fillLight.position.set(0,1,2);
            scene.add(fillLight);
            
            const grid = new THREE.GridHelper(14, 20, 0x88ff99, 0x226644);
            grid.position.y = -1.8;
            grid.material.transparent = true;
            grid.material.opacity = 0.2;
            scene.add(grid);
        }
        
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
                videoFeed.srcObject = stream;
                return true;
            } catch(e) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    videoFeed.srcObject = stream;
                    return true;
                } catch(e2) {
                    videoFeed.style.display = 'none';
                    return false;
                }
            }
        }
        
        async function requestGyroPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        return true;
                    }
                } catch(e) {}
                return false;
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                return true;
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (!gameActive) { if (renderer && camera) renderer.render(scene, camera); return; }
            const SMOOTH = 0.08;
            currentRotationY += (targetRotationY - currentRotationY) * SMOOTH;
            currentRotationX += (targetRotationX - currentRotationX) * SMOOTH;
            camera.rotation.order = 'YXZ';
            camera.rotation.y = currentRotationY * Math.PI / 180;
            camera.rotation.x = currentRotationX * Math.PI / 180;
            camera.rotation.z = 0;
            
            updateEnemiesMovement();
            renderer.render(scene, camera);
        }
        
        async function initGame() {
            startBtn.textContent = "CONNECTING...";
            startBtn.disabled = true;
            await initCamera();
            initThree();
            spawnEnemies(8);
            await requestGyroPermission();
            setTimeout(() => {
                if (!gyroEnabled && gameActive) {
                    useTouchControls = true;
                    initTouchControls();
                    gyroStatusEl.textContent = "INPUT: TOUCH";
                }
            }, 2500);
            gameActive = true;
            animate();
            
            let lastTap = 0;
            document.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (now - lastTap < 250) calibrateGyro();
                else if (!isDragging) shoot(e);
                lastTap = now;
            });
            document.addEventListener('click', (e) => {
                if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
                shoot(e);
            });
            window.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') reload();
                if (e.key === 'c' || e.key === 'C') calibrateGyro();
                if (e.key === ' ') shoot(e);
            });
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            startOverlay.style.display = 'none';
            startBtn.disabled = false;
            updateHealthUI();
            initAmmoBar();
            updateAmmoBar();
            msgInterval = setInterval(updateSystemMessage, 4000);
            periodicUIGlitch();
        }
        
        startBtn.addEventListener('click', initGame);
        restartBtn.addEventListener('click', restartGame);
        initAmmoBar();
    })();
</script>
</body>
</html>
