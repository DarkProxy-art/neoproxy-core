<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEO·PROXY // GYRO AR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Courier New', monospace; background: #000; overflow: hidden; width: 100vw; height: 100vh; position: fixed; }
        #camera-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        .hud { position: absolute; z-index: 3; pointer-events: none; font-family: 'Courier New', monospace; font-weight: bold; backdrop-filter: blur(8px); background: rgba(0,0,0,0.7); border-left: 3px solid #ff2a2a; padding: 8px 16px; color: #ff3a3a; text-shadow: 0 0 6px #ff0000; font-size: 14px; }
        .top-bar { top: 18px; left: 18px; right: 18px; display: flex; justify-content: space-between; border-left: none; border-right: 3px solid #ff2a2a; border-bottom: 1px solid #ff2a2a; }
        .bottom-left { bottom: 20px; left: 20px; font-size: 10px; }
        .bottom-right { bottom: 20px; right: 20px; font-size: 14px; }
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none; }
        .reload-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: black; border: 2px solid #ff0000; color: #ff5555; padding: 12px 24px; z-index: 20; display: none; font-family: monospace; font-size: 1.5rem; white-space: nowrap; }
        .hit-flash { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #ff0000; background: rgba(0,0,0,0.8); padding: 10px 20px; border: 1px solid #ff0000; z-index: 15; animation: fadeOut 0.8s forwards; font-family: monospace; font-size: 1.2rem; white-space: nowrap; }
        @keyframes fadeOut { 0% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%); } }
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; flex-direction: column; z-index: 100; }
        #start-button { background: #000; color: #ff0000; border: 2px solid #ff0000; padding: 15px 35px; font-family: monospace; font-size: 1.2rem; cursor: pointer; margin-top: 20px; }
        #game-over { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 200; }
        #restart-btn { background: #000; color: #ff0000; border: 2px solid #ff0000; padding: 10px 25px; margin-top: 20px; cursor: pointer; font-family: monospace; }
        .gyro-status { position: absolute; top: 80px; right: 12px; background: rgba(0,0,0,0.7); padding: 4px 8px; font-size: 9px; color: #ff8888; z-index: 3; border-radius: 4px; pointer-events: none; }
        .gyro-debug { position: absolute; bottom: 80px; left: 10px; background: rgba(0,0,0,0.6); padding: 4px 8px; font-size: 9px; color: #88ff88; z-index: 3; font-family: monospace; pointer-events: none; }
    </style>
</head>
<body>

<video id="camera-feed" autoplay playsinline muted></video>
<canvas id="game-canvas"></canvas>

<div class="hud top-bar">
    <div>NEO·PROXY GYRO AR</div>
    <div id="score">SCORE: 0</div>
</div>

<div class="crosshair">
    <svg width="40" height="40" viewBox="0 0 40 40">
        <line x1="20" y1="5" x2="20" y2="15" stroke="#ff0000" stroke-width="2"/>
        <line x1="20" y1="25" x2="20" y2="35" stroke="#ff0000" stroke-width="2"/>
        <line x1="5" y1="20" x2="15" y2="20" stroke="#ff0000" stroke-width="2"/>
        <line x1="25" y1="20" x2="35" y2="20" stroke="#ff0000" stroke-width="2"/>
        <circle cx="20" cy="20" r="5" fill="none" stroke="#ff0000" stroke-width="1"/>
    </svg>
</div>

<div class="hud bottom-left">
    <div>🎮 MUEVE EL CELULAR PARA APUNTAR</div>
    <div>🔫 TAP PARA DISPARAR | DOBLE TAP CALIBRAR</div>
</div>

<div class="hud bottom-right">
    <div id="ammo">AMMO: 12/12</div>
    <div id="enemies-count">👾 0</div>
</div>

<div class="gyro-status" id="gyro-status">⚡ GYRO: ESPERANDO...</div>
<div class="gyro-debug" id="gyro-debug">📐 yaw:0° pitch:0°</div>

<div id="reload-indicator" class="reload-indicator">⟳ RECARGANDO... ⟳</div>

<div id="start-overlay">
    <h1 style="color:#ff0000; margin-bottom:20px;">NEO·PROXY AR</h1>
    <p style="color:#ff6666; margin-bottom:10px;">REALIDAD AUMENTADA CON GIROSCOPIO</p>
    <button id="start-button">🎯 INICIAR AR</button>
    <p style="color:#aa5555; margin-top:20px; font-size:12px;">Permite acceso a la cámara y movimiento</p>
</div>

<div id="game-over">
    <h1 style="color:#ff0000;">💀 GAME OVER 💀</h1>
    <div id="final-score" style="color:#ff6666; font-size:24px; margin:20px;">0</div>
    <button id="restart-btn">⟳ REINICIAR ⟳</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    (function(){
        // ========== DOM ELEMENTS ==========
        const videoFeed = document.getElementById('camera-feed');
        const startOverlay = document.getElementById('start-overlay');
        const gameOverlay = document.getElementById('game-over');
        const startBtn = document.getElementById('start-button');
        const restartBtn = document.getElementById('restart-btn');
        const scoreEl = document.getElementById('score');
        const ammoEl = document.getElementById('ammo');
        const enemiesCountEl = document.getElementById('enemies-count');
        const reloadIndicator = document.getElementById('reload-indicator');
        const gyroStatusEl = document.getElementById('gyro-status');
        const gyroDebugEl = document.getElementById('gyro-debug');
        
        // ========== GAME STATE ==========
        let scene, camera, renderer;
        let enemies = [];
        let score = 0;
        let ammo = 12;
        let isReloading = false;
        let gameActive = false;
        
        // ========== GYROSCOPE ==========
        let currentRotationX = 0;
        let currentRotationY = 0;
        let targetRotationX = 0;
        let targetRotationY = 0;
        let calibrationX = 0;
        let calibrationY = 0;
        let gyroEnabled = false;
        
        function handleOrientation(event) {
            if (!gameActive) return;
            
            // gamma: left-right (-90 a 90) -> YAW
            // beta: front-back (-180 a 180) -> PITCH
            let gamma = event.gamma || 0;
            let beta = event.beta || 0;
            
            // Aplicar calibración
            let yaw = (gamma - calibrationX);
            let pitch = (beta - calibrationY);
            
            // Limitar ángulos para no marear
            yaw = Math.min(60, Math.max(-60, yaw));
            pitch = Math.min(50, Math.max(-50, pitch));
            
            targetRotationY = yaw;   // izquierda-derecha
            targetRotationX = pitch;  // arriba-abajo
            
            if (!gyroEnabled && (Math.abs(gamma) > 0.1 || Math.abs(beta) > 0.1)) {
                gyroEnabled = true;
                gyroStatusEl.textContent = '✅ GYRO: ACTIVO';
                gyroStatusEl.style.color = '#88ff88';
            }
            
            // Debug
            gyroDebugEl.textContent = `📐 yaw:${yaw.toFixed(1)}° pitch:${pitch.toFixed(1)}°`;
        }
        
        function calibrateGyro() {
            calibrationX = 0;
            calibrationY = 0;
            targetRotationX = 0;
            targetRotationY = 0;
            currentRotationX = 0;
            currentRotationY = 0;
            gyroStatusEl.textContent = '🎯 GYRO: CALIBRADO';
            gyroStatusEl.style.color = '#ffff88';
            setTimeout(() => {
                if(gyroStatusEl && gameActive) {
                    gyroStatusEl.textContent = '✅ GYRO: ACTIVO';
                    gyroStatusEl.style.color = '#88ff88';
                }
            }, 1500);
            console.log('Gyro calibrate');
        }
        
        // ========== CREAR ENEMIGOS FIJOS EN EL ESPACIO ==========
        function createEnemy(x, y, z) {
            const geometries = [
                new THREE.TorusKnotGeometry(0.45, 0.13, 120, 12, 3, 4),
                new THREE.IcosahedronGeometry(0.42, 0),
                new THREE.DodecahedronGeometry(0.4, 0)
            ];
            const geometry = geometries[Math.floor(Math.random() * geometries.length)];
            const material = new THREE.MeshStandardMaterial({
                color: 0xdd2222,
                emissive: 0x551111,
                emissiveIntensity: 0.5,
                metalness: 0.7,
                roughness: 0.3
            });
            
            const enemy = new THREE.Mesh(geometry, material);
            enemy.position.set(x, y, z);
            
            enemy.userData = {
                rotSpeedX: 0.008 + Math.random() * 0.01,
                rotSpeedY: 0.01 + Math.random() * 0.01,
                scaleOrig: 0.8 + Math.random() * 0.5,
                glitchTime: Date.now(),
                glitchInterval: 1500 + Math.random() * 2000,
                pulsePhase: Math.random() * Math.PI * 2
            };
            
            enemy.scale.setScalar(enemy.userData.scaleOrig);
            return enemy;
        }
        
        function spawnEnemies() {
            enemies.forEach(e => scene.remove(e));
            enemies = [];
            
            // Enemigos en posiciones fijas en 360 grados alrededor del jugador
            const positions = [
                { x: 3.5, y: 0.5, z: 3 },
                { x: -3, y: 0.2, z: 3.2 },
                { x: 2.5, y: -0.3, z: 4 },
                { x: -3.2, y: 0.8, z: 2.5 },
                { x: 0, y: 1.2, z: 4.5 },
                { x: 4, y: -0.2, z: 1.5 },
                { x: -3.5, y: 0.3, z: 2.8 },
                { x: 2, y: 1, z: 3.8 },
                { x: -1.5, y: -0.5, z: 5 },
                { x: 1, y: 1.5, z: 4.2 }
            ];
            
            const numEnemies = 6;
            for (let i = 0; i < numEnemies; i++) {
                const pos = positions[i % positions.length];
                const enemy = createEnemy(pos.x, pos.y + (Math.random() - 0.5) * 1.2, pos.z);
                scene.add(enemy);
                enemies.push(enemy);
            }
            
            updateEnemiesCount();
        }
        
        function respawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const radius = 3 + Math.random() * 2;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const y = (Math.random() - 0.5) * 2.5;
            
            const enemy = createEnemy(x, y, z);
            scene.add(enemy);
            enemies.push(enemy);
            updateEnemiesCount();
        }
        
        function updateEnemiesCount() {
            enemiesCountEl.textContent = `👾 ${enemies.length}`;
        }
        
        // ========== GAME MECHANICS ==========
        function shoot(event) {
            if (!gameActive || isReloading) return;
            if (event) event.preventDefault();
            
            if (ammo <= 0) {
                reload();
                return;
            }
            
            // Raycast desde el centro de la cámara (donde apunta la mira)
            const raycaster = new THREE.Raycaster();
            const center = new THREE.Vector2(0, 0);
            raycaster.setFromCamera(center, camera);
            
            const intersects = raycaster.intersectObjects(enemies);
            
            if (intersects.length > 0) {
                const hit = intersects[0].object;
                scene.remove(hit);
                const idx = enemies.indexOf(hit);
                if (idx > -1) enemies.splice(idx, 1);
                
                score += 100;
                updateUI();
                
                // Efecto visual de impacto
                const flash = document.createElement('div');
                flash.className = 'hit-flash';
                flash.textContent = '⚡ ELIMINADO +100 ⚡';
                document.body.appendChild(flash);
                setTimeout(() => flash.remove(), 700);
                
                // Vibrar si soporta
                if (navigator.vibrate) navigator.vibrate(50);
                
                // Respawnear nuevo enemigo
                setTimeout(() => {
                    if (gameActive && enemies.length < 10) {
                        respawnEnemy();
                    }
                }, 400);
            }
            
            ammo--;
            updateUI();
            
            if (ammo === 0) reload();
        }
        
        function reload() {
            if (isReloading) return;
            isReloading = true;
            reloadIndicator.style.display = 'flex';
            if (navigator.vibrate) navigator.vibrate(100);
            
            setTimeout(() => {
                ammo = 12;
                isReloading = false;
                reloadIndicator.style.display = 'none';
                updateUI();
            }, 1800);
        }
        
        function updateUI() {
            scoreEl.textContent = `SCORE: ${score}`;
            ammoEl.textContent = `AMMO: ${ammo}/12`;
        }
        
        function gameOver() {
            gameActive = false;
            document.getElementById('final-score').textContent = `SCORE: ${score}`;
            gameOverlay.style.display = 'flex';
        }
        
        function restartGame() {
            score = 0;
            ammo = 12;
            updateUI();
            
            enemies.forEach(e => scene.remove(e));
            enemies = [];
            spawnEnemies();
            
            gameActive = true;
            gameOverlay.style.display = 'none';
            
            // Reset gyro
            calibrateGyro();
        }
        
        // ========== ANIMACION ENEMIGOS ==========
        function animateEnemies() {
            const now = Date.now();
            
            for (let enemy of enemies) {
                // Rotación constante
                enemy.rotation.x += enemy.userData.rotSpeedX;
                enemy.rotation.y += enemy.userData.rotSpeedY;
                enemy.rotation.z += enemy.userData.rotSpeedY * 0.5;
                
                // Efecto glitch
                if (now - enemy.userData.glitchTime > enemy.userData.glitchInterval) {
                    const glitchScale = 1.25 + Math.random() * 0.5;
                    enemy.scale.setScalar(glitchScale);
                    
                    if (enemy.material) {
                        enemy.material.emissiveIntensity = 1.2;
                        setTimeout(() => {
                            if (enemy.material) enemy.material.emissiveIntensity = 0.4;
                        }, 120);
                    }
                    
                    setTimeout(() => {
                        if (enemy) enemy.scale.setScalar(enemy.userData.scaleOrig);
                    }, 150);
                    
                    enemy.userData.glitchTime = now;
                    enemy.userData.glitchInterval = 1400 + Math.random() * 2500;
                }
                
                // Pulsación suave
                if (enemy.material) {
                    const intensity = 0.4 + Math.sin(now * 0.005 + enemy.userData.pulsePhase) * 0.25;
                    enemy.material.emissiveIntensity = intensity;
                }
            }
        }
        
        // ========== THREE.JS ==========
        function initThree() {
            scene = new THREE.Scene();
            
            // Cámara en el origen (el jugador)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0);
            
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('game-canvas'), 
                alpha: true,
                antialias: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            
            // Luces
            const ambientLight = new THREE.AmbientLight(0x442222);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffaa88, 1.2);
            dirLight.position.set(2, 3, 4);
            scene.add(dirLight);
            
            const fillLight = new THREE.PointLight(0x992222, 0.6);
            fillLight.position.set(1, 2, 3);
            scene.add(fillLight);
            
            const backLight = new THREE.PointLight(0xff4444, 0.4);
            backLight.position.set(-2, 1, -3);
            scene.add(backLight);
            
            // Grid de referencia en el suelo
            const gridHelper = new THREE.GridHelper(12, 20, 0x882222, 0x442222);
            gridHelper.position.y = -1.3;
            gridHelper.material.transparent = true;
            gridHelper.material.opacity = 0.25;
            scene.add(gridHelper);
            
            // Pequeña esfera de referencia en el centro (opcional)
            const centerSphere = new THREE.Mesh(
                new THREE.SphereGeometry(0.1, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.5 })
            );
            scene.add(centerSphere);
        }
        
        // ========== CAMARA FEED ==========
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
                videoFeed.srcObject = stream;
                return true;
            } catch(e) {
                console.log('Camera error, trying default:', e);
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    videoFeed.srcObject = stream;
                    return true;
                } catch(e2) {
                    console.log('No camera:', e2);
                    videoFeed.style.display = 'none';
                    return false;
                }
            }
        }
        
        // ========== ANIMATION LOOP ==========
        function animate() {
            requestAnimationFrame(animate);
            
            if (!gameActive) {
                if (renderer && camera) renderer.render(scene, camera);
                return;
            }
            
            // Suavizado del giroscopio
            const SMOOTHING = 0.1;
            currentRotationY += (targetRotationY - currentRotationY) * SMOOTHING;
            currentRotationX += (targetRotationX - currentRotationX) * SMOOTHING;
            
            // Aplicar rotación a la cámara - ¡ESTA ES LA CLAVE!
            camera.rotation.order = 'YXZ';
            camera.rotation.y = currentRotationY * Math.PI / 180;
            camera.rotation.x = currentRotationX * Math.PI / 180;
            camera.rotation.z = 0;
            
            animateEnemies();
            renderer.render(scene, camera);
        }
        
        // ========== SOLICITAR PERMISO GIROSCOPIO (iOS) ==========
        async function requestGyroPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        gyroStatusEl.textContent = '✅ GYRO: PERMITIDO';
                        return true;
                    }
                } catch(e) {
                    console.log('Gyro permission denied:', e);
                    gyroStatusEl.textContent = '⚠️ GYRO: SIN PERMISO';
                    return false;
                }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                gyroStatusEl.textContent = '✅ GYRO: ACTIVO';
                return true;
            }
            return false;
        }
        
        // ========== INICIALIZAR JUEGO ==========
        async function initGame() {
            startBtn.textContent = '⟡ INICIANDO... ⟡';
            startBtn.disabled = true;
            
            await initCamera();
            initThree();
            spawnEnemies();
            
            // Activar giroscopio
            await requestGyroPermission();
            
            gameActive = true;
            animate();
            
            // Event listeners
            document.addEventListener('click', shoot);
            document.addEventListener('touchstart', shoot);
            
            // Tecla R para recargar
            window.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') reload();
                if (e.key === 'c' || e.key === 'C') calibrateGyro();
            });
            
            // Doble tap para calibrar
            let lastTap = 0;
            document.addEventListener('touchstart', (e) => {
                const now = Date.now();
                if (now - lastTap < 300) {
                    e.preventDefault();
                    calibrateGyro();
                }
                lastTap = now;
            });
            
            // Resize handler
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            startOverlay.style.display = 'none';
            startBtn.disabled = false;
            
            // Mensaje de bienvenida
            setTimeout(() => {
                if (gameActive) {
                    gyroStatusEl.textContent = '✅ GYRO: ACTIVO';
                }
            }, 500);
        }
        
        startBtn.addEventListener('click', initGame);
        restartBtn.addEventListener('click', restartGame);
        
        // Botón calibrar en game over
        const calOverlayBtn = document.createElement('button');
        calOverlayBtn.textContent = '🎯 CALIBRAR GIROSCOPIO';
        calOverlayBtn.style.cssText = 'background:#000;color:#ff0000;border:2px solid #ff0000;padding:10px 25px;margin-top:10px;cursor:pointer;font-family:monospace;font-size:12px;';
        calOverlayBtn.onclick = calibrateGyro;
        document.getElementById('game-over').appendChild(calOverlayBtn);
        
        console.log('Script loaded - esperando inicio');
    })();
</script>
</body>
</html>
